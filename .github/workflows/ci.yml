name: ci

# 推 main 或开 PR 时跑:后端 pytest + 前端 lint / 类型 / 单测。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest tests -q
      # 静态检查:ruff 抓明显的错(未用导入、错误的比较、可疑写法),
      # mypy 先只覆盖规格最严的三个文件(领域模型 / 状态机 / 持久化)。
      - run: ruff check app tests
      - run: mypy

  web:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
