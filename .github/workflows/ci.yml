# 质量门禁:PR 和 main 上的提交都要过 pytest / ruff / mypy / 前端检查。
#
# 为什么要有:工作区常有好几个会话同时改代码、经 PR 合并,以前没有任何东西挡着 ——
# mypy 配置指向已删除的 app/db.py 好几周没人发现,ruff 攒到 376 个错。
#
# 不跑的东西:tests/probe_*.py(联网)、tests/verify_*.py(烧真实额度),
# 以及标了 network / quota 的用例。CI 上没有 .env,也不配任何密钥。
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (pytest / ruff / mypy)
    # 开发机和日常跑服务的都是 Windows:路径、编码、子进程的坑只有在 Windows 上才露出来
    runs-on: windows-latest
    # runner 只有 4 核,pytest 比开发机慢一个数量级;30 分钟在第一次跑时就差点不够
    timeout-minutes: 45
    env:
      # GitHub 的 Windows runner 是英文区域设置,控制台按 cp1252 输出;测试名和跳过原因里有中文
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # 测试不启动服务,这几个开关只是兜底:万一有用例起了后台循环,也别去调接口、抓平台
      TEAM_ENABLED: "0"
      PUBLISH_ENABLED: "0"
      METRICS_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5

      # 临时文件改放到工作区所在的 D: 盘。默认的 %TEMP% 在系统盘 C: 上,小文件读写慢得多,
      # 而几乎每条用例都要在 tmp_path 下建库、写文件
      - name: Put temp files on the workspace drive
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          "TMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # 有几条用例拿 node 检查概念动画模版里的 JS 语法(不需要 motion/ 下的依赖)
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 渲染、混音、语音质检相关的约 60 条用例要真跑 ffmpeg,没有就跳过。
      # 装失败不拦流水线(那些用例照样会跳过),但这一步会标黄,看得见覆盖少了
      - name: Install ffmpeg
        continue-on-error: true
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | Select-Object -First 1

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: ruff
        run: python -m ruff check app tests

      - name: mypy
        run: python -m mypy

      # --durations:变慢时直接在日志末尾看到是哪几条
      - name: pytest
        run: python -m pytest -n auto -m "not network and not quota" -p no:cacheprovider --durations=20

  web:
    name: Web (eslint / tsc / vitest)
    # 前端零构建,工具链与平台无关,用启动快的 Linux runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check
