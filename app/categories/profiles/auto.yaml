# 汽车解说 —— 内容方向库
name: auto
label: 汽车
aspect_ratio: "9:16"
duration_grid: 6

# 事实来源:车型硬参数走 ifind.product_news(检索新闻正文),
# 公司/行业数据走 iFinD,工商与合规走企查查。
# 这里是无方向(profile 级)来源;各方向的 fact_sources 在 themes 里覆盖它。
fact_sources:
  - ifind.product_news
  - ifind.stock_summary
  - ifind.financials
  - ifind.news
  - qcc.profile

script_style: >
  面向考虑购买的中产家庭,口语化、短句、有画面感。
  禁止夸张承诺,参数必须来自事实层。
  全片控制在 {chars} 字左右,平均每镜 {per_shot} 字。

# --------------------------------------------------------------------------
# 内容方向
#
# 一条视频只讲一个方向。每个方向用 blocks 声明"有哪些段落、各占多重篇幅",
# plan_for() 再按目标镜头数(时长 / 6)确定性铺展成最终的段落序列 ——
# 因此不必为每个时长手写一份 plan。
#
# 块数不得超过最短时长的镜头数(10),否则铺展时必然压到 0。
# --------------------------------------------------------------------------
default_theme: overview

themes:

  # ---------------------------------------------------------------- 概览
  overview:
    label: 通用车型概览
    intent: >
      面向潜在买家的标准车型介绍:外观内饰、核心参数、体验与购买建议。
    required_scopes: [product]
    fact_sources:
      - ifind.product_news
      - ifind.stock_summary
      - ifind.financials
      - ifind.news
      - qcc.profile
    blocks:
      - {section: 开场钩子, weight: 1, remainder: false}
      - {section: 核心卖点, weight: 3}
      - {section: 参数硬数据, weight: 2}
      - {section: 卖点深挖, weight: 2}
      - {section: 竞品对比, weight: 1}
      - {section: 购买建议, weight: 1}

  # ------------------------------------------------------------ 车型迭代史
  iteration:
    label: 车型迭代史
    intent: >
      梳理这一车系从首发到现款的演进:每一代改了什么、为什么改、
      现款相比初代站在什么位置。数字必须带年份,旧参数绝不能当作现售配置。
    required_scopes: [product, industry]
    # 必须带 market_news:只靠迭代通稿实测 industry 只有 1 条,
    # 缺口横幅会每次都亮 —— 一个总在喊狼来了的告警等于没有告警。
    fact_sources:
      - ifind.product_news
      - ifind.iteration_news
      - ifind.market_news
    script_rules:
      - 提到任何一代的参数时,必须在句中注明年份,并在事实引用的 claim 中保留年份。
      - 不同代际的参数并列时必须显式区分"哪一代",不得混为一谈。
      - 现款参数与历代参数的对比必须同口径(同为 CLTC 或同为NEDC)。
    blocks:
      - {section: 开场钩子, weight: 1, remainder: false}
      - {section: 历代车型, weight: 4}
      - {section: 改款升级, weight: 3}
      - {section: 版本变迁, weight: 2}
      - {section: 参数硬数据, weight: 2}
      - {section: 迭代意义, weight: 2}

  # -------------------------------------------------- 横向对比与购车决策
  compare:
    label: 横向对比与购车决策
    intent: >
      把这台车放到同级里横向比:哪些维度领先、哪些维度落后、适合谁不适合谁。
      对比必须客观,只陈述差异,不做主观贬低。
    required_scopes: [product]
    fact_sources:
      - ifind.product_news
      - ifind.compare_news
    script_rules:
      - 涉及竞品的每个数字都必须有本条事实引用支撑,没有就不写。
      - 只做事实层面的差异陈述,禁止对竞品做主观贬低。
      - 结论必须落到"什么人选它、什么人不选它",不给模糊的"各有优劣"。
    blocks:
      - {section: 开场钩子, weight: 1, remainder: false}
      - {section: 对比维度, weight: 3}
      - {section: 参数硬数据, weight: 3}
      - {section: 竞品对比, weight: 2}
      - {section: 选购决策, weight: 2}

  # -------------------------------------------------------- 技术与设计拆解
  tech:
    label: 技术与设计拆解
    intent: >
      讲清这台车在技术上解决了什么问题:三电、平台、智驾、底盘调校,
      以及这些技术选择如何体现在日常驾驶感受上。
    required_scopes: [product]
    fact_sources:
      - ifind.product_news
      - ifind.tech_news
    script_rules:
      - 技术名词首次出现必须用一句话解释它是什么,不要假设观众懂行话。
      - 只讲可验证的技术特性,不臆造参数或技术细节。
      - 技术优势必须落到可感知的体验上,不要停留在参数罗列。
    blocks:
      - {section: 开场钩子, weight: 1, remainder: false}
      - {section: 核心技术, weight: 3}
      - {section: 设计拆解, weight: 3}
      - {section: 参数硬数据, weight: 2}
      - {section: 使用体验, weight: 2}
      - {section: 总结, weight: 1}

  # ------------------------------------- 优势、缺点与真实使用成本
  cost:
    label: 优势、缺点与真实使用成本
    intent: >
      既讲优点也讲缺点,并把用车成本摊开算:能耗、保险、保养、折旧。
      敢讲缺点才有可信度,但只准讲本车,不准贬低别家。
    required_scopes: [product]
    allow_subject_critique: true
    fact_sources:
      - ifind.product_news
      - ifind.cost_news
    script_rules:
      - 缺点必须讲具体(哪个环节、什么条件下出现),不得用"当然也有不足"敷衍。
      - 缺点与优势必须成对出现,不允许全片只夸或只贬。
      - 用车成本必须说明估算口径与前提,不得给出无依据的精确金额。
      - 只讲本车的缺点。评价任何别家品牌时只做客观差异陈述,禁止贬低。
    extra_forbidden_terms:
      - "智商税"
      - "劝退"
      - "垃圾"
      - "辣鸡"
    blocks:
      - {section: 开场钩子, weight: 1, remainder: false}
      - {section: 优势, weight: 3}
      - {section: 缺点, weight: 3}
      - {section: 使用成本, weight: 3}
      - {section: 参数硬数据, weight: 2}
      - {section: 购买建议, weight: 2}

  # ------------------------------------------------- 品牌历史与产品战略
  brand:
    label: 品牌历史与产品战略
    intent: >
      讲这家车企怎么起来的、在行业里打过哪些仗、现在的产品战略往哪走。
      全片主体是公司层与行业层事实,不把产品参数当战略依据。
    required_scopes: [company, industry]
    # 必须带 market_news:「战略解读」要落到这套战略在行业里的位置,
    # 而 ifind.news 的查询串("新车 发布 销量 财报 重大事件")天然偏公司财经,
    # 实测只靠它 industry 事实为 0 条。
    fact_sources:
      - ifind.news
      - ifind.market_news
      - qcc.profile
      - ifind.stock_summary
    script_rules:
      - 本方向的主体是公司与行业:注册资本、成立时间、经营范围、财报、销量结构、
        市场份额都是正当素材。
      - 禁止用产品参数(续航、加速、配置)去论证公司战略或行业结论。
      - 涉及公司沿革的年份必须准确,并在句中写明年份。
    blocks:
      - {section: 开场钩子, weight: 1, remainder: false}
      - {section: 品牌起点, weight: 3}
      - {section: 发展历程, weight: 3}
      - {section: 产品战略, weight: 3}
      - {section: 战略解读, weight: 2}

  # -------------------------------------------- 汽车市场观察与热点解析
  market:
    label: 汽车市场观察与热点解析
    intent: >
      站在行业视角看这家车企和这个细分市场:份额、格局、近期热点事件与趋势。
      全片主体是行业数据,不把单个产品参数当成市场结论。
    required_scopes: [industry, company]
    fact_sources:
      - ifind.market_news
      - ifind.news
    script_rules:
      - 本方向的主体是行业数据:渗透率、份额、排名、销量总量、政策与热点事件。
      - 行业数字必须标明统计口径与时间范围(如"2026 年上半年""乘用车口径")。
      - 禁止用单个产品的参数去论证市场趋势或竞争格局。
    blocks:
      - {section: 开场钩子, weight: 1, remainder: false}
      - {section: 市场格局, weight: 3}
      - {section: 热点事件, weight: 3}
      - {section: 参数硬数据, weight: 2}
      - {section: 趋势解读, weight: 2}

# --------------------------------------------------------------------------
# 段落词表
#
# 单一扁平命名空间,所有方向共用 —— profile.section(name) 的调用点无需区分方向。
# beat 决定画面,camera 归一到官方运镜词表,angle 决定参考图视角,
# multi_subject 标记该段落画面需要出现第二台车(对比 / 迭代史场景)。
# --------------------------------------------------------------------------
sections:
  开场钩子:
    beat: 车辆低机位切入,动态开场,第一眼抓住注意力
    camera: Push In
    angle: exterior_45
    narration_style: 制造悬念或提出购车痛点,不出现具体参数
  核心卖点:
    beat: 车辆外观与内饰的标志性设计,亮出该车最有辨识度的卖点
    camera: Arc Shot
    angle: exterior_45
    narration_style: 具体、克制,用可验证的细节支撑
  参数硬数据:
    beat: 关键参数的可视化呈现,仪表或数据界面
    camera: Static Shot
    angle: detail
    narration_style: 播报可量化数据,每句必须挂事实引用
    requires_fact: true
  卖点深挖:
    beat: 内饰做工、材质与使用场景的细节特写
    camera: Truck Left
    angle: interior
    narration_style: 体验式描述,强调日常使用感受
  竞品对比:
    beat: 与主要竞品并排同框,两个整车同时可见
    camera: Pan Left
    angle: exterior_45
    narration_style: 客观陈述差异,不做主观贬低
    multi_subject: true
  购买建议:
    beat: 车辆静置于光线下收尾定格
    camera: Pull Out
    angle: exterior_45
    narration_style: 给出明确的人群匹配建议

  # ---- 车型迭代史 ----
  历代车型:
    beat: 两代不同年款的车并排陈列,一眼看出前后代际差异
    camera: Truck Right
    angle: exterior_45
    narration_style: 按时间顺序讲清每一代,每代给出可验证的差异点
    multi_subject: true
  改款升级:
    beat: 新旧款同框对照,镜头扫过被改动的部位
    camera: Pan Right
    angle: detail
    narration_style: 说清这次改款改了什么、解决了什么问题
    multi_subject: true
  版本变迁:
    beat: 不同配置版本的车身细节差异
    camera: Truck Left
    angle: exterior_45
    narration_style: 梳理版本之间的配置取舍与价格带关系
  迭代意义:
    beat: 现款车辆静态全览,收束整条演进线
    camera: Pull Out
    angle: exterior_45
    narration_style: 总结这条演进线说明了什么,现款处在什么位置

  # ---- 横向对比 ----
  对比维度:
    beat: 屏幕或数据界面上逐项列出对比维度
    camera: Static Shot
    angle: screen_spec
    narration_style: 逐一说明对比哪几个维度、为什么选这几个维度
  选购决策:
    beat: 车辆静置收尾,画面留出决策感
    camera: Pull Out
    angle: exterior_45
    narration_style: 按人群给出明确取舍建议

  # ---- 技术与设计拆解 ----
  核心技术:
    beat: 三电系统或机械结构件的特写,可见的硬件细节
    camera: Truck Left
    angle: detail
    narration_style: 用通俗语言解释这项技术解决什么问题
  设计拆解:
    beat: 车身曲面、灯组或内饰布局的设计细节特写
    camera: Arc Shot
    angle: detail
    narration_style: 讲清设计意图,以及它如何服务于功能
  使用体验:
    beat: 实际驾驶或乘坐视角的座舱画面
    camera: POV
    angle: interior
    narration_style: 把技术落到日常可感知的体验上
  总结:
    beat: 车辆全貌收尾
    camera: Pull Out
    angle: exterior_45
    narration_style: 一句话收束这套技术路线的取舍

  # ---- 优势缺点与真实成本 ----
  优势:
    beat: 该车最有说服力的优势场景实拍
    camera: Arc Shot
    angle: exterior_45
    narration_style: 具体、可验证,每个优势配一个真实场景
  缺点:
    beat: 真实使用中不便之处的实拍,不做遮丑摆拍
    camera: Truck Left
    angle: interior
    narration_style: 讲清在什么条件下出现什么不便,具体到场景
  使用成本:
    beat: 仪表与能耗/费用相关的数据界面
    camera: Static Shot
    angle: screen_spec
    narration_style: 摊开讲能耗、保险、保养等成本,说明估算口径

  # ---- 品牌历史与产品战略 ----
  品牌起点:
    beat: 早期代表车型的实车或工厂历史画面
    camera: Truck Right
    angle: exterior_45
    narration_style: 讲这家车企最早是做什么的、起点在哪一年
  发展历程:
    beat: 多个时间点的品牌画面并置,呈现时间跨度
    camera: Pan Right
    angle: exterior_45
    narration_style: 按时间顺序讲关键转折点,每个转折都要有年份
  产品战略:
    beat: 产品矩阵或展台的陈列画面
    camera: Tracking Shot
    angle: exterior_45
    narration_style: 讲现在的产品布局与投入方向
  战略解读:
    beat: 品牌标识或展台收尾
    camera: Pull Out
    angle: exterior_45
    narration_style: 解读这套战略在行业里的位置与风险

  # ---- 市场观察 ----
  市场格局:
    beat: 行业销量榜或份额分布的数据可视化
    camera: Static Shot
    angle: screen_spec
    narration_style: 用数据说明这个细分市场现在是谁在拿份额
  热点事件:
    beat: 车展、发布会或行业事件的现场画面
    camera: Tracking Shot
    angle: industry
    narration_style: 讲清事件本身与它对市场的影响
  趋势解读:
    beat: 数据界面收尾,趋势线清晰可见
    camera: Pull Out
    angle: screen_spec
    narration_style: 从数据推出趋势判断,并点明不确定性

visual_keywords: [汽车, 轿车, 新能源汽车, 内饰, 续航, 座舱]
reference_query_template: "{subject} 实拍 {angle}"

angle_queries:
  exterior_45: 45度前侧 整车
  interior: 内饰 座舱 全景
  rear: 尾部
  detail: 细节 特写 仪表
  screen_spec: 仪表盘 数据界面 屏幕
  industry: 车展 发布会 展台

# --------------------------------------------------------------------------
# 官方素材渠道
#
# 车辆镜头的取材顺序里排在最前:品牌官方号视频 → 车企官网 / 媒体中心 → 官图库。
# aliases:主体名 / 上传者名里出现任一别名即认作该品牌(判定官方号也靠它)。
# sites:  官网域名,用 `site:域名 车型` 站内检索找车型页,抓页面里的视频与大图。
# media:  新闻 / 媒体中心域名,官方宣传片与高清官图常在这里。
# 只写域名不写车型页地址:官网改版换路径很常见,站内检索不受影响。
# --------------------------------------------------------------------------
