# 合规:广告法绝对化用语
forbidden_terms: [最强, 第一, 顶级, 永久, 国家级, 唯一, 最先进, 100%安全, 无敌, 秒杀]
required_disclaimers: ["数据来源:公开信息与官方渠道,仅供参考,实际以购车时为准"]

music_prompt: >
  instrumental electronic background music, steady mid tempo, clean modern
  automotive commercial feel, light percussion, no vocals, no lyrics
