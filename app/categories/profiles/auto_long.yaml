# --------------------------------------------------------------------------
# 推算规则(pipeline/derive.py):把已核对的参数换算成体感数字,事实层自动追加,
# 来源标 derived,claim 里写明算式与源事实。
# --------------------------------------------------------------------------
derive: [hp_to_kw, charge_rate, pack_consumption]

# --------------------------------------------------------------------------
# 原理库:脚本讲"为什么"时能引用的通用技术常识(k_ 开头)。
# 只讲机理与取舍,**不许写数字** —— 数字只能来自事实层(加载时会校验)。
# 事实清单里出现 terms 之一,这一条才进脚本提示词。
# --------------------------------------------------------------------------
principles:
  - id: k_sic
    terms: [碳化硅, SiC]
    explain: 碳化硅功率器件的开关损耗和导通损耗都比传统硅基器件低,电驱把电能变成动力时浪费成热的部分更少,同样的电池能多跑一些,也更扛得住高压快充。
    tradeoff: 器件更贵;省下的电耗在高速巡航、中低负载时最明显,不是所有工况都能感知。
  - id: k_hv
    terms: [高压平台, 高压快充, 800V, 900V, 897V, 752V]
    explain: 充电功率等于电压乘电流。电压抬高后,同样的功率只需要更小的电流,线束和电芯发热更少,大功率能维持得更久,补能时间就短。
    tradeoff: 想用满这个速度,得找到支持高压的大功率桩;在普通快充桩上优势不明显。
  - id: k_lfp
    terms: [磷酸铁锂, LFP]
    explain: 磷酸铁锂电芯的晶体结构稳定,热失控门槛高,循环寿命长,成本也低,适合主打耐用和安全的入门版本。
    tradeoff: 能量密度比三元锂低,同样续航电池更重;冬天低温时续航和充电速度掉得更明显。
  - id: k_ncm
    terms: [三元锂, 三元电池, NCM]
    explain: 三元锂电芯能量密度高,同样重量能装更多电,所以长续航和高性能版本常用它。
    tradeoff: 成本更高,热稳定性不如磷酸铁锂,更依赖电池包的热管理和安全结构。
  - id: k_cltc
    terms: [CLTC]
    explain: CLTC 是中国轻型车测试工况,在实验室按固定的速度曲线测出来,以城市低速为主,不开空调、也没有长时间高速。
    tradeoff: 真实续航尤其是跑高速、冬天开暖风时,会明显低于 CLTC 标称;只有同为 CLTC 的数字放在一起比才公平。
  - id: k_tops
    terms: [TOPS, 算力]
    explain: TOPS 是芯片每秒能做多少万亿次运算,决定了车上能跑多大的感知和决策模型,相当于智驾能力的上限。
    tradeoff: 算力不等于智驾水平,真正的表现取决于算法、数据积累和软件迭代;算力只说明上限够不够高。
  - id: k_lidar
    terms: [激光雷达, LiDAR]
    explain: 激光雷达主动发射激光测距,直接得到周围物体的三维位置,不依赖环境光,夜里、逆光、遇到形状奇怪的障碍物时比只靠摄像头更可靠。
    tradeoff: 大雨、大雪、浓雾里性能会下降;装了雷达,还要看算法把它用到什么程度。
  - id: k_4d_radar
    terms: [4D毫米波, 4D 毫米波]
    explain: 毫米波雷达穿透雨雾的能力强、能直接测速;新一代的四维版本多了高度信息,能分清前方是桥、路牌还是真正的车。
    tradeoff: 分辨率仍不如激光雷达,更多是补位感知、在恶劣天气兜底。
  - id: k_multilink
    terms: [双叉臂, 五连杆, 多连杆]
    explain: 双叉臂和多连杆悬架用多根连杆约束车轮,转弯和过颠簸时车轮更贴地、车身姿态更稳,操控和舒适能同时兼顾。
    tradeoff: 结构复杂、成本高、占空间;同样的结构,调校好坏决定最终体验。
  - id: k_cdc
    terms: [CDC, 可变阻尼, 连续阻尼]
    explain: 连续可变阻尼减振器能按路况和驾驶模式实时调软硬,过坑时放软、急弯时收紧。
    tradeoff: 它不改变车身高度,和空气悬架是两回事;效果同样取决于调校。
  - id: k_air_susp
    terms: [空气悬架, 空悬]
    explain: 空气悬架用气囊代替钢制弹簧,能调车身高度和软硬,高速时降低车身减风阻,烂路时升高提高通过性。
    tradeoff: 购置和维修成本更高,长期可靠性取决于气泵和气囊的品质。
  - id: k_torsion
    terms: [扭转刚度]
    explain: 扭转刚度衡量车身抵抗扭曲变形的能力。刚度越高,悬架越能按设计工作,车身异响更少、转向更精准,碰撞时乘员舱也更不容易变形。
    tradeoff: 它是底子,不是结果;舒适和操控最后还要看悬架怎么调。
  - id: k_cd
    terms: [风阻系数, Cd]
    explain: 风阻系数描述车身造型受到的空气阻力。车速越高,风阻在电耗里的占比越大,系数越低,高速续航越好。
    tradeoff: 真正的风阻还要乘上迎风面积,大车系数低,不代表总风阻就小。
  - id: k_ccb
    terms: [碳陶, 碳陶瓷]
    explain: 碳陶制动盘耐高温、抗热衰退,连续重刹也能保持制动力,而且比铸铁盘轻,能减少簧下质量。
    tradeoff: 价格和更换成本都高;日常通勤用不出它的优势。
  - id: k_heatpump
    terms: [热泵]
    explain: 热泵空调像反着用的冰箱,从车外空气里搬热量进车内,比电阻丝直接加热省电得多,冬天续航掉得少。
    tradeoff: 外面特别冷时热泵效率下降,还是要靠辅助加热。
  - id: k_ctb
    terms: [CTB, CTC, CTP, 电池车身一体化]
    explain: 把电芯直接集成进电池包或车身结构,省掉中间的模组,同样空间能装更多电芯,电池包还能当车身结构件,整车更刚。
    tradeoff: 出了问题更难只换局部,对电池安全设计的要求也更高。
  - id: k_casting
    terms: [一体压铸]
    explain: 一体压铸把大量冲压焊接的小零件合成一个大铸件,车身更轻、精度更一致,生产也更快。
    tradeoff: 碰撞受损后很难局部修复,维修成本可能更高。
