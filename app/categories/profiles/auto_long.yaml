# 汽车横屏解说 —— 对标「三驱兄弟」式的信息型长视频
#
# - 官方宣传片 / 实拍只当这台车的**背景画面**(随便哪段干净的都行,
#   短镜头连拼),信息靠叠加层传达 —— 侧边参数面板、两行大字关键词、数据卡、底部章节条。
# - 一镜 = 一个节拍 = 一段旁白,时长由 TTS 实际时长决定。
#   duration_grid 只用来估节拍数(平均每拍 8 秒,约 46 字)。
# - 16:9 横屏,1920×1080。
name: auto_long
label: 汽车解说
aspect_ratio: "16:9"
track: explainer
duration_grid: 8
durations: [120, 240, 360, 480]
# 竖屏项目的时长档位(竖屏平台看完播率,更短)。不是栅格整数倍也行:拍数四舍五入
durations_portrait: [60, 90, 120, 180]

# 事实来源:车型硬参数走 ifind.product_news(检索新闻正文),
# 公司/行业数据走 iFinD,工商与合规走企查查。
# 这里是无方向(profile 级)来源;各方向的 fact_sources 在 themes 里覆盖它。
fact_sources:
  - ifind.product_news
  - ifind.stock_summary
  - ifind.financials
  - ifind.news
  - qcc.profile

script_style: >
  像懂车的朋友当面给建议:口语化、短句、观点明确,每段只讲一个点。
  参数必须来自事实层,不说空话套话,不夸张承诺。
  全片控制在 {chars} 字左右,平均每段 {per_shot} 字。

default_theme: buyguide

themes:
  buyguide:
    label: 单车选购深讲
    intent: >
      围绕"这台车值不值得买、该买哪个版本"展开:定位与价格 → 外观内饰 → 三电与性能 →
      智能配置 → 版本怎么选 → 和对手比 → 结论(适合谁、不适合谁)。
      每段给出明确判断,参数只是论据。
    required_scopes: [product]
    fact_sources:
      # 在售版本清单(年款、版本名、指导价、驱动形式):版本选择段的底子,也防止推荐停售版本
      - dongchedi.lineup
      # 参数配置表(整备质量、悬架、轮胎、电芯、离地间隙):新闻通稿基本不写,车迷最先问
      - autohome.specs
      - ifind.product_news
      - ifind.tech_news
      # 竞品与用车成本:没有这两条,「竞品对比」只能靠形容词、「用车成本」整段写不了
      - ifind.compare_news
      - ifind.cost_news
      - ifind.news
    script_rules:
      - 每段开头一句就亮观点,再用一两个参数或事实支撑,不要先堆参数。
      - 每个数字后面接一句"所以呢":15 分钟补 405 公里 → 吃顿饭的工夫够跑一趟上海到南京;
        车宽快 2 米 → 老小区窄车位、地库拐弯得先量一量;没有"对谁意味着什么",数字就别单独摆。
      - opening: [conflict, myth, number]
        rule: >-
          开场要是立场不是选题:「别急着订车,先搞清楚买哪版」是选题;
          「多花 3 万买的不是续航,是快充」是立场 —— 有取舍,有人会反对。
      - 结论段必须说清楚适合哪类人、不适合哪类人。
      - {opening: [conflict, myth, number], rule: '开场第一句不超过 18 字,直接抛冲突或结论;不说"大家好""今天来聊聊""欢迎"之类的开场白。'}
      - {opening: conflict, rule: '开头三段分开写:先抛冲突,立刻兑现刚才抛出的那个数字,再用一句话亮出"每个数字都能查到出处"。'}
      - {ending: action, rule: '结尾要给行动:最后一句要么提问(你在纠结哪款?评论区说),要么预告下期做什么。'}
      - 讲技术按"是什么 → 为什么(原理)→ 对你意味着什么 → 代价或边界"走。三电性能、智能配置两段,
        每段至少一句引用原理清单(k_ 开头)讲清为什么,并至少一句讲代价或适用边界。
      - 代价和缺点只能用原理条目里写明的"代价/边界",或事实清单里明确写到的问题;
        不许自己推测这台车的缺点(空间、做工、屏幕反光、异响之类),没有依据就不说。
      - 续航、电耗、加速这类数字必须带口径或版本(如"CLTC 标称""GT 版"),口径取自事实的"口径"一栏。
      - 能用推算事实(来源 derived)把参数翻译成体感时优先用,比如把补能写成"每分钟补多少公里"。
      - 不许用"很猛""很良心""有诚意""闭眼入"这类空洞评价代替论据:要评价,就说清楚比什么、好在哪。
      - 竞品对比段必须给**可比的数字**:引用「对比」类事实(一条事实里写清两台车同一维度的取值),
        说清本车这一项高在哪、低在哪。没有可用对比事实就把这段改成定性描述,
        不许写"配置给得足""门槛压得低"这种没有数字的比较。
      - 用车成本段讲落地价之后还要花的钱:电费、保险、保养、保值率。
        有事实就写数字并说明口径;算不出年成本就只讲定性,不许编。
    # 开头 / 结尾写法(pipeline/variety.py),第一个是老项目的默认;建项目时避开最近几条用过的
    openings: [conflict, question, scene, myth, number]
    endings: [action, pick_side, next_episode, verdict, decision_card]
    # 竖屏短时长(60s ≈ 8 拍)放不下全部块时按 drop 整档精简(1 先砍,0 = 必留);横屏档位块数放得下,不受影响
    # only_opening:只有冲突三段式开头才有「兑现承诺」「亮出出处」;
    # movable:外观 / 内饰 / 三电 / 智能之间没有先后依赖,每个项目换一个顺序讲
    blocks:
      - {section: 开场, weight: 1, remainder: false}
      - {section: 兑现承诺, weight: 1, remainder: false, drop: 1, only_opening: [conflict]}
      - {section: 亮出出处, weight: 1, remainder: false, drop: 1, only_opening: [conflict]}
      - {section: 定位与价格, weight: 2}
      - {section: 外观设计, weight: 2, movable: true}
      - {section: 内饰空间, weight: 2, drop: 3, movable: true}
      - {section: 三电性能, weight: 3, movable: true}
      - {section: 智能配置, weight: 2, movable: true}
      - {section: 版本选择, weight: 2, drop: 2}
      - {section: 竞品对比, weight: 2, drop: 3}
      - {section: 用车成本, weight: 2, drop: 2}
      - {section: 结论建议, weight: 1, remainder: false}

  # 多车横评:建项目时填车单(3–5 台),subject 是选题名(如「15 万级纯电 SUV 横评」)。
  # 每台车各采各的事实、各建一个轻量素材池;per_subject 块按车单顺序每车展开一份,
  # 每台车一章。
  roundup:
    label: 多车横评
    intent: >
      围绕"同一个预算 / 需求下这几台车各自适合谁"展开:开场点出这期比哪几台车、
      按什么标准比 → 每台车依次讲亮相定位、核心卖点、参数价格、适合谁 →
      结论按人群给推荐。不评出唯一的赢家,每个判断都落到具体的参数或配置上。
    subject_count: [3, 5]
    required_scopes: [product]
    fact_sources:
      - dongchedi.lineup
      - autohome.specs
      - ifind.product_news
      - ifind.tech_news
    script_rules:
      - 每段只讲段落序列里〔〕标注的那台车,不要在别的车的段落里插话比较。
      - 车与车的比较只放在开场和结论;比较时每个数字都要引用它自己那台车的事实,口径(CLTC / 版本)不一致的数字不放在一起比。
      - 结论按人群和用途给推荐(如"通勤为主选谁""常跑长途选谁"),不说"谁最好""谁赢了"。
      - 开场第一句不超过 18 字,直接抛出这期最大的冲突或悬念;不说"大家好""今天来聊聊""欢迎"之类的开场白。
      - 缺点只能用原理条目里写明的"代价/边界",或事实清单里明确写到的问题;不许自己推测某台车的缺点。
      - 续航、电耗、加速这类数字必须带口径或版本(如"CLTC 标称""长续航版"),口径取自事实的"口径"一栏。
      - 不许用"很猛""很良心""有诚意""闭眼入"这类空洞评价代替论据。
      - 段落序列里某台车没有「参数价格」段时,把它的售价放进「车型亮相」;没有「适合谁」段时,在它最后一段末尾用一句话说清适合谁。
    openings: [conflict, question, scene, number]
    endings: [action, pick_side, next_episode, decision_card]
    # 车多时长短(如 5 台车 2 分钟)按 drop 精简每车段落:先砍「适合谁」(1),再砍「参数价格」(2)
    blocks:
      - {section: 横评开场, weight: 1, remainder: false}
      - per_subject:
          - {section: 车型亮相, weight: 1}
          - {section: 核心卖点, weight: 2}
          - {section: 参数价格, weight: 1, drop: 2}
          - {section: 适合谁, weight: 1, drop: 1}
      - {section: 横评结论, weight: 2, remainder: false}

  # 单点深挖:整期只讲一个点(选题角度就是这个点,建项目必填),讲透"是什么 → 为什么 →
  # 数字 → 代价 → 对谁有用"。只讲一个点的片子不拉长:最长 4 分钟。
  deepdive:
    label: 单点深挖
    intent: >
      整期只讲选题角度里的那一个点(一项技术、一个配置、一个争议参数),别的卖点一概不提:
      先抛这个点上最反常识的判断 → 它是什么 → 为什么能做到(原理)→ 关键数字 →
      代价和边界 → 对谁真有用 → 一句话结论。宁深勿广。
    requires_angle: true
    max_duration: 240
    required_scopes: [product]
    fact_sources:
      - dongchedi.lineup
      - autohome.specs
      - ifind.tech_news
      - ifind.product_news
      - ifind.compare_news
    script_rules:
      - 全片只讲选题角度里的那一个点;跟它无关的参数、配置、价格一概不提,哪怕事实清单里有。
      - 「为什么」段必须引用原理清单(k_ 开头)讲清机理,并把原理条目里的代价/边界讲出来。
      - 每个数字后面接一句"所以呢":换算成日常场景、跟同级比,或点出对谁有用。
      - 开场第一句不超过 18 字,直接切进这个点;不说"大家好""今天来聊聊"。
      - 代价和缺点只能用原理条目里写明的"代价/边界",或事实清单里明确写到的问题;不许自己推测。
      - 续航、电耗、加速这类数字必须带口径或版本,口径取自事实的"口径"一栏。
      - 不许用"很猛""很良心""有诚意""闭眼入"这类空洞评价代替论据。
    openings: [number, question, myth, scene]
    endings: [verdict, next_episode, action]
    # 竖屏 60s 只放得下 4 段:先砍「对谁有用」,再砍「是什么」,再砍「代价边界」
    blocks:
      - {section: 深挖开场, weight: 1, remainder: false}
      - {section: 是什么, weight: 2, drop: 2}
      - {section: 为什么, weight: 3}
      - {section: 关键数字, weight: 2}
      - {section: 代价边界, weight: 2, drop: 3}
      - {section: 对谁有用, weight: 1, drop: 1}
      - {section: 深挖结论, weight: 1, remainder: false}

  # 问答式:每章回答一个买家最常问的问题,章节名就是问题(脚本给 heading)。
  qa:
    label: 问答式
    intent: >
      用"买这台车前最该搞清楚的几个问题"组织全片:开场抛出最尖锐的那个问题 →
      每章回答一个问题(先一句话给答案,再给数字和依据,最后说对谁意味着什么)→
      结论把几个答案串成一句判断。问题要是真实买家会问的(够不够用、值不值、
      哪版划算、有什么坑),不是"它的外观怎么样"这种平的提问。
    max_duration: 360
    required_scopes: [product]
    fact_sources:
      - dongchedi.lineup
      - autohome.specs
      - ifind.product_news
      - ifind.tech_news
      - ifind.cost_news
      - ifind.compare_news
    script_rules:
      - 「问题」段每段给一个 heading:就是这一章回答的问题,12 字以内,用问句(如「冬天续航打几折?」)。
        同一章拆成多段时 heading 写同一句。
      - 每个问题先用一句话直接给答案(够 / 不够、值 / 不值、选哪版),再给数字和依据,不许绕。
      - 几个问题不能重复讲同一件事;每个问题落到一个具体的决策(买不买、买哪版、要不要加钱)。
      - 每个数字后面接一句"所以呢";没有依据的问题就换一个有事实可答的问题,不许编答案。
      - 开场第一句不超过 18 字,直接抛最尖锐的那个问题或答案;不说"大家好""今天来聊聊"。
      - 续航、电耗、加速这类数字必须带口径或版本,口径取自事实的"口径"一栏。
      - 不许自己推测这台车的缺点;代价只能来自原理条目的"代价/边界"或事实里写明的问题。
    openings: [question, scene, number]
    endings: [action, next_episode, verdict]
    blocks:
      - {section: 问答开场, weight: 1, remainder: false}
      - {section: 问题一, weight: 2}
      - {section: 问题二, weight: 2}
      - {section: 问题三, weight: 2, drop: 3}
      - {section: 问题四, weight: 2, drop: 2}
      - {section: 问题五, weight: 2, drop: 1}
      - {section: 问答结论, weight: 1, remainder: false}

  # 1v1 对决:两台车,按维度逐章对打(每章同时讲两台车),章末给这一维的胜负,
  # 结论给比分但按人群推荐。建项目时车单填 2 台。
  pk:
    label: 1v1 对决
    intent: >
      两台车按维度逐项对打:开场抛出这场对决最大的悬念 → 价格 → 空间 → 三电 → 智能,
      每一章同时摆出两台车同一维度的数字,章末一句判这一维谁占优、对谁重要 →
      结论报比分,再按人群给推荐(谁该选 A、谁该选 B)。
    versus: true
    subject_count: [2, 2]
    required_scopes: [product]
    fact_sources:
      - dongchedi.lineup
      - autohome.specs
      - ifind.product_news
      - ifind.tech_news
    script_rules:
      - 每一章都要同时讲两台车的**同一维度**,两边的数字各自引用自己那台车名下的事实;
        口径(CLTC / 版本)不一致的数字不放在一起比,改成定性说。
      - 每章最后一句判这一维谁占优、差距对谁重要(「差 3 万,对预算卡死的人是决定性的」);
        某一维没有两边可比的事实,就说"这一项打平 / 没法比",不许硬判。
      - 结论先报比分(如「4 个维度 3 比 1」),再按人群推荐:谁该选 A、谁该选 B;不说"谁最好""谁赢了"。
      - 开场第一句不超过 18 字,直接抛出这场对决最大的悬念;不说"大家好""今天来聊聊"。
      - 不许贬低任何一台车,也不许自己推测缺点;差距只用数字和事实里写明的问题说。
      - 续航、电耗、加速这类数字必须带口径或版本,口径取自事实的"口径"一栏。
    openings: [conflict, question, number]
    endings: [pick_side, verdict, next_episode]
    # 竖屏 60s 只放得下 4 段:先砍「智能」,再砍「空间」;价格之后的三个维度谁先比都行
    blocks:
      - {section: 对决开场, weight: 1, remainder: false}
      - {section: 对决价格, weight: 2}
      - {section: 对决空间, weight: 2, drop: 2, movable: true}
      - {section: 对决三电, weight: 3, movable: true}
      - {section: 对决智能, weight: 2, drop: 1, movable: true}
      - {section: 对决结论, weight: 2, remainder: false}

  # 槽点 / 争议:先摆网上对这台车的争议,逐条拿事实核对,给出"说对了 / 说过头了 / 说反了"。
  debate:
    label: 槽点争议
    intent: >
      拿网上对这台车争议最大的几个说法开刀:开场亮出最大的那个争议 →
      每章一个争议(网上怎么说 → 事实怎么说 → 判断:说对了 / 说过头了 / 说反了)→
      结论给出这些争议加起来,这台车到底适合谁。立场鲜明,但每个判断都要有出处。
    allow_subject_critique: true
    max_duration: 360
    required_scopes: [product]
    fact_sources:
      - dongchedi.lineup
      - autohome.specs
      - ifind.controversy_news
      - ifind.product_news
      - ifind.tech_news
    script_rules:
      - 「争议」段每段给一个 heading:这一章的争议,12 字以内(如「续航虚标?」「车机卡不卡」)。
        同一章拆成多段时 heading 写同一句。
      - 争议只能来自事实清单(topic 为「争议」的事实,或事实里写明的问题、投诉、召回);
        事实里没有的槽点不许自己编,也不许写"有网友说"却不引用事实。
      - 每个争议都要有判断:说对了、说过头了,还是说反了,并用数字或事实说明为什么。
      - 本车的缺点可以直说,但要有出处;不许贬低竞品,不许用"智商税""劝退""垃圾"这类词。
      - 开场第一句不超过 18 字,直接抛最大的那个争议;不说"大家好""今天来聊聊"。
      - 续航、电耗、加速这类数字必须带口径或版本,口径取自事实的"口径"一栏。
    openings: [myth, question, conflict]
    endings: [verdict, pick_side, action]
    blocks:
      - {section: 争议开场, weight: 1, remainder: false}
      - {section: 争议一, weight: 3}
      - {section: 争议二, weight: 3, drop: 2}
      - {section: 争议三, weight: 3, drop: 1}
      - {section: 争议结论, weight: 1, remainder: false}

# 版式说明(pipeline/explainer.py):
#   broll     全屏这台车的宣传片
#   panel     宣传片 + 左侧参数面板(车名、3–5 项参数)
#   highlight 宣传片缩成小窗 + 两行大字关键词
#   card      整屏数据卡(spec / compare / bars / timeline,按 card 字段)
#   stat      宣传片压暗 + 中央一个大数字从 0 滚到目标值(一个核对过的参数)
#   concept   整屏概念动画(HyperFrames 渲染 motion/scenes/,模板见 vocab.concept_scenes),
#             讲电池、补能、加速、智驾这类"看不见的东西";数字同样只来自核对过的事实
# angle 在这里只决定背景画面偏外观还是偏车内,不要求逐镜对上。
sections:
  开场:
    beat: 第一句 18 字内直接抛出这台车最反常识的结论、争议或最硬的一个数字(黄金三秒)
    chapter: 开头
    angle: exterior_45
    layouts: [hook, highlight, broll]
  兑现承诺:
    beat: 立刻兑现开场抛出的那句话:把那个数字或判断摆出来,不许绕,不许拖到后面
    chapter: 开头
    angle: exterior_45
    layouts: [panel, stat, highlight, broll]
  亮出出处:
    beat: 一句话亮出「每个数字都能查到出处」,全片只说这一次,说完恢复正常解说
    chapter: 开头
    angle: exterior_45
    layouts: [highlight, broll]
  定位与价格:
    beat: 它卖多少钱、打谁、在品牌里是什么位置
    chapter: 定位价格
    angle: exterior_45
    layouts: [panel, card, stat, broll]
    card: spec
    requires_fact: true
  外观设计:
    beat: 外观设计亮点与尺寸
    chapter: 外观内饰
    angle: exterior_45
    layouts: [broll, highlight, panel, stat, concept]
  内饰空间:
    beat: 座舱、空间、做工与实用性
    chapter: 外观内饰
    angle: interior
    layouts: [broll, highlight, panel]
  三电性能:
    beat: 动力、续航、补能、底盘
    chapter: 三电性能
    angle: exterior_45
    layouts: [card, stat, concept, highlight, broll, panel]
    card: spec
    requires_fact: true
  智能配置:
    beat: 智驾硬件、座舱芯片与功能
    chapter: 智能配置
    angle: interior
    layouts: [highlight, broll, panel, stat, concept]
  版本选择:
    beat: 各版本价格与配置差异,推荐哪个
    chapter: 怎么选
    angle: exterior_45
    layouts: [card, panel, broll]
    card: spec
    requires_fact: true
  竞品对比:
    beat: 与最主要的对手比关键维度
    chapter: 怎么选
    angle: exterior_45
    layouts: [card, concept, broll]
    card: compare
  用车成本:
    beat: 落地价之后还要花的钱:电费、保险、保养、保值率
    chapter: 用车成本
    angle: exterior_45
    layouts: [card, panel, stat, highlight, broll]
    card: spec
    requires_fact: true
  结论建议:
    beat: >-
      先用 3 个最关键的数字(价格、续航、补能之类)收束,再说适合谁、不适合谁;
      最后一句给行动:一句提问(你在纠结哪款?评论区说)或下期预告
    chapter: 结论
    angle: exterior_45
    # card 在前:3 个关键数字做成一张能截图带走的卡;没引用事实时核不过,自动退回下一个版式
    layouts: [card, highlight, broll]
    card: spec

  # ---- 多车横评(roundup)用的段落。每车的段落章节名由代码换成车名 ----
  横评开场:
    beat: 第一句 18 字内抛出这期横评最大的冲突或悬念,再交代比哪几台车、按什么标准比
    chapter: 开头
    angle: exterior_45
    layouts: [hook, highlight, broll]
  车型亮相:
    beat: 这台车是谁、卖多少钱、在车单里是什么定位
    angle: exterior_45
    layouts: [panel, highlight, broll]
  核心卖点:
    beat: 这台车最值得说的一两个卖点,讲清为什么
    angle: exterior_45
    layouts: [highlight, stat, concept, broll, panel]
  参数价格:
    beat: 关键参数与各版本价格
    angle: exterior_45
    layouts: [card, panel, stat, broll]
    card: spec
    requires_fact: true
  适合谁:
    beat: 这台车适合哪类人、不适合哪类人
    angle: interior
    layouts: [broll, highlight]
  横评结论:
    beat: 把几台车放在一起,按人群和用途给推荐
    chapter: 结论
    angle: exterior_45
    layouts: [card, highlight, broll]
    card: bars

  # ---- 单点深挖(deepdive) ----
  深挖开场:
    beat: 第一句 18 字内抛出这个点上最反常识的判断或最硬的一个数字
    chapter: 开头
    angle: exterior_45
    layouts: [hook, highlight, broll]
  是什么:
    beat: 用一句大白话说清这个点是什么、这台车上具体是哪套东西
    chapter: 是什么
    angle: exterior_45
    layouts: [highlight, panel, concept, broll]
  为什么:
    beat: 讲清它为什么能做到(引用原理),以及跟常规做法差在哪
    chapter: 为什么
    angle: exterior_45
    layouts: [concept, highlight, panel, broll]
  关键数字:
    beat: 这个点最硬的一两个数字,每个都换算成观众能感知的场景
    chapter: 关键数字
    angle: exterior_45
    layouts: [stat, card, panel, concept, highlight]
    card: spec
    requires_fact: true
  代价边界:
    beat: 这个点的代价和适用边界:什么情况下它不灵、要多付出什么
    chapter: 代价
    angle: exterior_45
    layouts: [highlight, broll, panel]
  对谁有用:
    beat: 这个点对哪类人是刚需、对哪类人可有可无
    chapter: 对谁有用
    angle: interior
    layouts: [broll, highlight]
  深挖结论:
    beat: 一句话判断这个点值不值,最后一句给行动
    chapter: 结论
    angle: exterior_45
    layouts: [highlight, card, broll]
    card: spec

  # ---- 问答式(qa)。章节名用脚本给的 heading(问题本身)----
  问答开场:
    beat: 第一句 18 字内抛出最尖锐的那个问题,或直接给出它的答案
    chapter: 开头
    angle: exterior_45
    layouts: [hook, highlight, broll]
  问题一: &qa_question
    beat: 回答一个买家最常问的问题:先一句话给答案,再给数字和依据,最后说对谁意味着什么
    chapter: 问题一
    heading: true
    angle: exterior_45
    layouts: [highlight, panel, stat, card, concept, broll]
    card: spec
  问题二:
    <<: *qa_question
    chapter: 问题二
    angle: interior
  问题三:
    <<: *qa_question
    chapter: 问题三
  问题四:
    <<: *qa_question
    chapter: 问题四
    angle: interior
  问题五:
    <<: *qa_question
    chapter: 问题五
  问答结论:
    beat: 把几个问题的答案串成一句判断,说清适合谁、不适合谁,最后一句给行动
    chapter: 结论
    angle: exterior_45
    layouts: [card, highlight, broll]
    card: spec

  # ---- 1v1 对决(pk)。每段同时讲两台车,柱状图的行名写车名 ----
  对决开场:
    beat: 第一句 18 字内抛出这场对决最大的悬念,再交代比哪两台、比哪几项
    chapter: 开头
    angle: exterior_45
    layouts: [hook, highlight, broll]
  对决价格:
    beat: 两台车的售价与版本区间放在一起比,章末判这一维谁占优
    chapter: 价格
    angle: exterior_45
    layouts: [card, panel, stat, highlight, broll]
    card: bars
  对决空间:
    beat: 尺寸、轴距、空间与实用性放在一起比,章末判这一维谁占优
    chapter: 空间
    angle: interior
    layouts: [card, panel, highlight, concept, broll]
    card: bars
  对决三电:
    beat: 续航、补能、加速放在一起比(口径一致才比),章末判这一维谁占优
    chapter: 三电
    angle: exterior_45
    layouts: [card, stat, concept, panel, highlight, broll]
    card: bars
  对决智能:
    beat: 智驾硬件、座舱芯片与功能放在一起比,章末判这一维谁占优
    chapter: 智能
    angle: interior
    layouts: [card, panel, highlight, concept, broll]
    card: bars
  对决结论:
    beat: 报比分,再按人群推荐谁该选哪台,最后一句给行动
    chapter: 结论
    angle: exterior_45
    layouts: [card, highlight, broll]
    card: bars

  # ---- 槽点争议(debate)。章节名用脚本给的 heading(争议本身)----
  争议开场:
    beat: 第一句 18 字内抛出这台车最大的那个争议,带上你的立场
    chapter: 开头
    angle: exterior_45
    layouts: [hook, highlight, broll]
  争议一: &debate_point
    beat: 一个争议:网上怎么说 → 事实怎么说(数字、出处)→ 判断:说对了 / 说过头了 / 说反了
    chapter: 争议一
    heading: true
    angle: exterior_45
    layouts: [highlight, panel, stat, card, broll]
    card: spec
  争议二:
    <<: *debate_point
    chapter: 争议二
    angle: interior
  争议三:
    <<: *debate_point
    chapter: 争议三
  争议结论:
    beat: 这些争议加起来,这台车到底适合谁、不适合谁,最后一句给行动
    chapter: 结论
    angle: exterior_45
    layouts: [highlight, card, broll]
    card: spec

visual_keywords: [汽车, 轿车, 新能源汽车, 内饰, 续航, 座舱]
reference_query_template: "{subject} 实拍 {angle}"

angle_queries:
  exterior_45: 45度前侧 整车
  interior: 内饰 座舱 全景
  rear: 尾部
  detail: 细节 特写 仪表
  screen_spec: 仪表盘 数据界面 屏幕
  industry: 车展 发布会 展台

# --------------------------------------------------------------------------
# 官方素材渠道
#
# 车辆镜头的取材顺序里排在最前:品牌官方号视频 → 车企官网 / 媒体中心 → 官图库。
# aliases:主体名 / 上传者名里出现任一别名即认作该品牌(判定官方号也靠它)。
# sites:  官网域名,用 `site:域名 车型` 站内检索找车型页,抓页面里的视频与大图。
# media:  新闻 / 媒体中心域名,官方宣传片与高清官图常在这里。
# 只写域名不写车型页地址:官网改版换路径很常见,站内检索不受影响。
# tiktok: TikTok 官方号(不带 @)。TikTok 没有可用的站内搜索,只能拉官方号主页再按文案
#         对题。名单必须人工核对,不能按名字猜:`bydglobal` 发的是油画、`xiaomi` 是个人号。
#         2026-10-20 核对。没列的品牌是没找到官方号,或 yt-dlp 解析不了(极氪 / 吉利 /
#         长城 / 小鹏 / 理想:报 "Unable to extract secondary user ID")。
# --------------------------------------------------------------------------
official_sites:
  byd:
    aliases: [比亚迪, BYD, 海豹, 海豚, 海狮, 腾势, 仰望, 方程豹]
    sites: [bydauto.com.cn, byd.com]
    media: [byd.com/cn/news]
    tiktok: [byd_global]
  tesla:
    aliases: [特斯拉, Tesla, Model 3, Model Y, Model S, Model X, Cybertruck]
    sites: [tesla.cn, tesla.com]
    media: [tesla.com/presskit]
    # 媒体图库(tesla.cn/tesla-gallery 背后的 Cloudinary 标签列表),原图 4000 宽;2026-10 核对
    press:
      - "Model Y=https://digitalassets.tesla.com/tesla-contents/image/list/tesla-gallery-new-model-y.json"
      - "Model Y L=https://digitalassets.tesla.com/tesla-contents/image/list/tesla-gallery-model-y-l.json"
      - "Model 3=https://digitalassets.tesla.com/tesla-contents/image/list/tesla-gallery-model-3-2024.json"
      - "Model 3 Performance=https://digitalassets.tesla.com/tesla-contents/image/list/tesla-gallery-model-3-performance.json"
      - "Cybertruck=https://digitalassets.tesla.com/tesla-contents/image/list/tesla-gallery-cybertruck.json"
  lixiang:
    aliases: [理想, Li Auto, LiAuto]
    sites: [lixiang.com]
    media: []
  nio:
    aliases: [蔚来, NIO, 乐道, 萤火虫]
    sites: [nio.cn, nio.com]
    media: []
    tiktok: [nio]
  xpeng:
    aliases: [小鹏, XPENG, Xpeng]
    sites: [xiaopeng.com, heyxpeng.com]
    media: []
  xiaomi:
    aliases: [小米汽车, 小米SU7, 小米YU7, Xiaomi SU7, Xiaomi YU7, Xiaomi EV]
    sites: [xiaomiev.com]
    media: []
    # 没有公开的媒体中心;车型页上的大图就是官方宣传图(2560 宽);2026-10 核对
    press:
      - "YU7=https://www.xiaomiev.com/yu7"
      - "SU7=https://www.xiaomiev.com/su7"
  aito:
    aliases: [问界, AITO, 赛力斯, 鸿蒙智行, 智界, 享界, 尊界]
    sites: [aito.auto, seres.cn]
    media: []
    tiktok: [aito_global]
  geely:
    aliases: [吉利, Geely, 银河, 领克, Lynk, 极氪, Zeekr, ZEEKR]
    sites: [geely.com, zeekrlife.com, lynkco.com.cn]
    media: []
    tiktok: [lynkcoglobal]
  gwm:
    aliases: [长城, 哈弗, 魏牌, 坦克, 欧拉, 长城炮, GWM, Haval, TANK]
    sites: [gwm.com.cn]
    media: []
  chery:
    aliases: [奇瑞, Chery, 星途, 捷途]
    sites: [chery.cn]
    media: []
    tiktok: [chery_international]
  volkswagen:
    aliases: [大众, Volkswagen, VW, ID.3, ID.4, ID.7, 帕萨特, 迈腾, 朗逸]
    sites: [vw.com.cn, faw-vw.com, svw-volkswagen.com]
    media: [volkswagen-newsroom.com]
    tiktok: [volkswagen]
  toyota:
    aliases: [丰田, Toyota, 凯美瑞, 卡罗拉, RAV4, 汉兰达, 雷克萨斯, Lexus]
    sites: [toyota.com.cn, gac-toyota.com.cn, ftms.com.cn]
    media: [pressroom.toyota.com, global.toyota]
    tiktok: [toyota]
  honda:
    aliases: [本田, Honda, 雅阁, 思域, CR-V]
    sites: [honda.com.cn, ghac.cn, dongfeng-honda.com]
    media: [hondanews.com]
    tiktok: [honda]
  bmw:
    aliases: [宝马, BMW, MINI]
    sites: [bmw.com.cn]
    media: [press.bmwgroup.com]
    tiktok: [bmw]
  mercedes:
    aliases: [奔驰, Mercedes, Benz, 迈巴赫, Maybach, AMG]
    sites: [mercedes-benz.com.cn]
    media: [group-media.mercedes-benz.com]
    tiktok: [mercedesbenz]
  audi:
    aliases: [奥迪, Audi]
    sites: [audi.cn]
    media: [audi-mediacenter.com]

# 合规:广告法绝对化用语
forbidden_terms: [最强, 第一, 顶级, 永久, 国家级, 唯一, 最先进, 100%安全, 无敌, 秒杀]
# 发布标题里额外躲开的套话(再叠加 packaging 里内置的搜索词式说法)
title_avoid: [全网首发, 重磅, 炸裂, 颠覆, 秒懂, 干货]
required_disclaimers: ["数据来源:公开信息与官方渠道,仅供参考,实际以购车时为准"]

music_prompt: >
  instrumental electronic background music, steady mid tempo, clean modern
  automotive commercial feel, light percussion, no vocals, no lyrics

# 自动收集 BGM 的 Mixkit 风格(免费商用无需署名),收进 data/bgm/auto_long/
bgm_genres: [tech, corporate-music, documentary]

# 旁白音色(MiniMax)
voice_id: male-qn-jingying

# 静图来源(providers/official.GALLERIES):汽车之家官图按视角分好类;official_site 是
# 车企官网车型页 + 媒体中心的大图(只认点名这台车的页面)。
# 懂车帝(dongchedi)图库要登录(素材库页「登录懂车帝」):官方图 + 外观 / 内饰 1920 宽大图;
# 没登录时这一项跳过、不记成抓过,登录后下次重建自动补上
# 易车(yiche)代码已接入但暂未启用:对脚本回验证码,且被「操作过于频繁」限制过。
# 能正常打开后:python -m scripts.browser_unblock https://car.yiche.com/ 过一次验证码,
# 再把 yiche 加回下面这行(没过时会跳过、不记成抓过,下次补上)
galleries: [autohome, official_site, press, dongchedi]

# 热点选题口径(字段说明见 app/categories.TrendSpec)。品牌兜底词另外并上 official_sites 别名
trends:
  rank: dongchedi
  news_queries: ["新车 上市 发布会 汽车", "汽车 官降 降价 限时优惠", "汽车 召回 事故 OTA 智驾"]
  bili_queries: ["新车 评测", "汽车 试驾"]
  hot_words: [汽车, 新车, 车型, 车企, 电车, 电动车, 新能源, 智驾, 辅助驾驶, 自动驾驶,
              续航, 充电, 换电, 车展, SUV, 轿车, 提车, 交付, 销量, 召回, 降价,
              官降, OTA, 增程, 混动, 4S店, 车主]
  brands: [比亚迪, 特斯拉, 小米汽车, 小米SU7, 小米YU7, 理想, 蔚来, 小鹏, 问界, 华为,
           吉利, 长城, 哈弗, 奇瑞, 长安, 零跑, 极氪, 领克, 埃安, 广汽, 大众,
           丰田, 本田, 宝马, 奔驰, 奥迪, 保时捷, 智界, 享界, 尊界, 阿维塔, 深蓝,
           极越, 岚图, 腾势, 仰望, 方程豹, 星途, 坦克, 魏牌, 鸿蒙智行, 乐道, 萤火虫]
  sources_label: 懂车帝榜单 · 汽车新闻 · 抖音热榜 · B站热门
  sources_desc: 销量/热度榜、近期新闻、抖音热搜、B站高播放视频
  subject_rule: "写成「品牌+车系」(照抄榜单条目里的品牌和车系名,\n     如榜单写「吉利银河 星愿」就写「吉利银河星愿」),"
  priority_rule: 优先「销量/热度榜靠前 + 有新闻或热搜事件」的交叉热点,其次纯榜单车型。

# 事实来源 → 检索词(接在车型名后面)。一条查询只表达一个意图,理由见 providers/facts.py
fact_queries:
  ifind.news: 新车 发布 销量 财报 重大事件
  ifind.product_news: 车型 参数 续航 加速 售价 配置 上市
  ifind.iteration_news: 历代车型 改款 换代 停产 升级
  ifind.compare_news: 对比 竞品 同级 差异 相比
  ifind.cost_news: 用车成本 保险 保养 电费 油耗 保值率
  ifind.tech_news: 技术 架构 三电 智驾 平台 底盘 调校
  ifind.controversy_news: 争议 槽点 投诉 质疑 车主吐槽 回应
  ifind.market_news: 销量 市场份额 排名 行业格局 渗透率

