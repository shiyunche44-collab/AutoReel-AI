# 合规:广告法绝对化用语
forbidden_terms: [最强, 第一, 顶级, 永久, 国家级, 唯一, 最先进, 100%安全, 无敌, 秒杀]
required_disclaimers: ["数据来源:公开信息与官方渠道,仅供参考,实际以购车时为准"]

music_prompt: >
  instrumental electronic background music, steady mid tempo, clean modern
  automotive commercial feel, light percussion, no vocals, no lyrics

# 自动收集 BGM 的 Mixkit 风格(免费商用无需署名),收进 data/bgm/auto_long/
bgm_genres: [tech, corporate-music, documentary]

# 旁白音色(MiniMax)
voice_id: male-qn-jingying

# 静图来源(providers/official.GALLERIES):汽车之家官图按视角分好类。
# 懂车帝(dongchedi)也能用,图多是 640 宽的文章配图,暂不开
galleries: [autohome]

# 热点选题口径(字段说明见 app/categories.TrendSpec)。品牌兜底词另外并上 official_sites 别名
trends:
  rank: dongchedi
  news_queries: ["新车 上市 发布会 汽车", "汽车 官降 降价 限时优惠", "汽车 召回 事故 OTA 智驾"]
  bili_queries: ["新车 评测", "汽车 试驾"]
  hot_words: [汽车, 新车, 车型, 车企, 电车, 电动车, 新能源, 智驾, 辅助驾驶, 自动驾驶,
              续航, 充电, 换电, 车展, SUV, 轿车, 提车, 交付, 销量, 召回, 降价,
              官降, OTA, 增程, 混动, 4S店, 车主]
  brands: [比亚迪, 特斯拉, 小米汽车, 小米SU7, 小米YU7, 理想, 蔚来, 小鹏, 问界, 华为,
           吉利, 长城, 哈弗, 奇瑞, 长安, 零跑, 极氪, 领克, 埃安, 广汽, 大众,
           丰田, 本田, 宝马, 奔驰, 奥迪, 保时捷, 智界, 享界, 尊界, 阿维塔, 深蓝,
           极越, 岚图, 腾势, 仰望, 方程豹, 星途, 坦克, 魏牌, 鸿蒙智行, 乐道, 萤火虫]
  sources_label: 懂车帝榜单 · 汽车新闻 · 抖音热榜 · B站热门
  sources_desc: 销量/热度榜、近期新闻、抖音热搜、B站高播放视频
  subject_rule: "写成「品牌+车系」(照抄榜单条目里的品牌和车系名,\n     如榜单写「吉利银河 星愿」就写「吉利银河星愿」),"
  priority_rule: 优先「销量/热度榜靠前 + 有新闻或热搜事件」的交叉热点,其次纯榜单车型。

# 事实来源 → 检索词(接在车型名后面)。一条查询只表达一个意图,理由见 providers/facts.py
fact_queries:
  ifind.news: 新车 发布 销量 财报 重大事件
  ifind.product_news: 车型 参数 续航 加速 售价 配置 上市
  ifind.iteration_news: 历代车型 改款 换代 停产 升级
  ifind.compare_news: 对比 竞品 同级 差异 相比
  ifind.cost_news: 用车成本 保险 保养 电费 油耗 保值率
  ifind.tech_news: 技术 架构 三电 智驾 平台 底盘 调校
  ifind.market_news: 销量 市场份额 排名 行业格局 渗透率

# --------------------------------------------------------------------------
