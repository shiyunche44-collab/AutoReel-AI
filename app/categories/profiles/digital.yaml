# 数码产品 —— v2 骨架(可加载,行业逻辑待补)
name: digital
label: 数码
aspect_ratio: "9:16"
duration_grid: 6
skeleton: true
todo:
  - 补充数码类事实来源(3C 参数库 / 电商评价 / 评测媒体)
  - 补充数码类运镜与视觉指导
  - 校准数码类合规词表
  - 补充首图检索模板(白底产品图 / 场景图)

fact_sources:
  - ifind.news
  - qcc.profile

script_style: 面向数码爱好者的理性种草,参数先行,体验收尾。

section_plan:
  60: [开场钩子, 核心卖点, 核心卖点, 核心卖点, 参数硬数据, 参数硬数据,
       体验场景, 体验场景, 竞品对比, 购买建议]
  90: [开场钩子, 核心卖点, 核心卖点, 核心卖点, 核心卖点, 参数硬数据,
       参数硬数据, 参数硬数据, 体验场景, 体验场景, 体验场景,
       竞品对比, 竞品对比, 购买建议, 购买建议]
  120: [开场钩子, 开场钩子, 核心卖点, 核心卖点, 核心卖点, 核心卖点,
        核心卖点, 核心卖点, 参数硬数据, 参数硬数据, 参数硬数据, 参数硬数据,
        体验场景, 体验场景, 体验场景, 体验场景,
        竞品对比, 竞品对比, 购买建议, 购买建议]

sections:
  开场钩子:
    beat: 产品特写切入,光线勾勒工业设计
    camera: Push In
    angle: product_hero
    narration_style: 提出痛点,不出现参数
  核心卖点:
    beat: 产品的设计与材质细节
    camera: Arc Shot
    angle: product_hero
    narration_style: 具体克制
  参数硬数据:
    beat: 参数界面或规格可视化
    camera: Static Shot
    angle: screen_spec
    narration_style: 播报可量化数据
    requires_fact: true
  体验场景:
    beat: 真实使用场景
    camera: Tracking Shot
    angle: lifestyle
    narration_style: 体验式描述
  竞品对比:
    beat: 与竞品同框对照
    camera: Pan Left
    angle: comparison
    narration_style: 客观差异
  购买建议:
    beat: 产品静置收尾
    camera: Pull Out
    angle: product_hero
    narration_style: 人群匹配建议

visual_keywords: [数码, 消费电子, 产品特写, 参数]
reference_query_template: "{subject} 产品图 {angle}"
angle_queries:
  product_hero: 45度 产品主图
  screen_spec: 屏幕 参数 界面
  lifestyle: 使用场景 生活
  comparison: 对比

forbidden_terms: [最强, 第一, 顶级, 永久, 唯一, 100%安全, 无敌, 秒杀, 吊打]
required_disclaimers: ["参数以官方标称为准,实测结果受环境影响"]

music_prompt: instrumental lo-fi background music, steady tempo, no vocals
