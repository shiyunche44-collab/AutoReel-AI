# 家居产品 —— v2 骨架(可加载,行业逻辑待补)
name: home
label: 家居
aspect_ratio: "9:16"
duration_grid: 6
skeleton: true
todo:
  - 补充家居类事实来源(质检报告 / 尺寸材质标准 / 电商评价)
  - 补充场景化视觉参考(客厅/卧室/厨房等空间)
  - 校准家居类合规词表(承重、阻燃、环保等级等宣称需有依据)
  - 增加"安装难度"类表述的事实支撑

fact_sources:
  - qcc.profile
  - qcc.product_spot_check
  - ifind.news

script_style: 面向租房与首套房人群,强调空间利用与真实使用体验,场景化叙述。

section_plan:
  60: [开场钩子, 场景痛点, 场景痛点, 产品外观, 产品外观, 安装过程,
       收纳效果, 收纳效果, 竞品对比, 购买建议]
  90: [开场钩子, 场景痛点, 场景痛点, 场景痛点, 产品外观, 产品外观,
       产品外观, 安装过程, 安装过程, 收纳效果, 收纳效果,
       竞品对比, 竞品对比, 购买建议, 购买建议]
  120: [开场钩子, 开场钩子, 场景痛点, 场景痛点, 场景痛点, 场景痛点,
        产品外观, 产品外观, 产品外观, 产品外观,
        安装过程, 安装过程, 收纳效果, 收纳效果, 收纳效果, 收纳效果,
        竞品对比, 竞品对比, 购买建议, 购买建议]

sections:
  开场钩子:
    beat: 整洁空间的全景,产品作为视觉焦点
    camera: Push In
    angle: lifestyle
    narration_style: 描述空间氛围,不给结论
  场景痛点:
    beat: 使用前的混乱状态特写
    camera: Truck Left
    angle: lifestyle
    narration_style: 描述痛点,客观不过度渲染
  产品外观:
    beat: 产品材质与做工特写
    camera: Arc Shot
    angle: product_hero
    narration_style: 具体描述材质与尺寸
  安装过程:
    beat: 组装或安装的动作过程
    camera: Tracking Shot
    angle: detail
    narration_style: 客观描述安装步骤与所需工具
    requires_fact: true
  收纳效果:
    beat: 安装完成后的空间全景
    camera: Pull Out
    angle: lifestyle
    narration_style: 呈现使用后的空间变化
  竞品对比:
    beat: 同类产品的并列对照
    camera: Pan Left
    angle: comparison
    narration_style: 客观差异陈述
  购买建议:
    beat: 空间全景收尾
    camera: Pull Out
    angle: lifestyle
    narration_style: 按户型与预算给出建议

visual_keywords: [家居, 收纳, 室内, 客厅, 家具]
reference_query_template: "{subject} 产品图 {angle}"
angle_queries:
  lifestyle: 场景 实拍 家居
  product_hero: 产品 45度 主图
  detail: 材质 细节 特写
  comparison: 对比

forbidden_terms: [最强, 第一, 顶级, 永久, 唯一, 零甲醛, 100%安全, 无敌, 承重无限]
required_disclaimers: ["尺寸与材质以商品详情页为准,安装效果受户型条件影响"]

music_prompt: warm acoustic instrumental background music, relaxed tempo, no vocals
