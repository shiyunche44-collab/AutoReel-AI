<!-- 产品镜:自带影棚底,用这台车的正侧面白底官图
     @portrait yes -->
<meta name="hf-bg" content="studio" />
<meta name="hf-photo" content="exterior_side" />
<style>
    #packwrap { position: absolute; perspective: 1500px; perspective-origin: 50% -40%; }
    .pack { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-style: preserve-3d;
            border-radius: 18px; border: 2px solid rgba(var(--acc), 0.85);
            background: linear-gradient(180deg, rgba(var(--acc), 0.10) 0%, rgba(var(--acc), 0.03) 100%);
            box-shadow: 0 0 40px rgba(var(--acc), calc(0.25 * var(--glow))), inset 0 0 30px rgba(var(--acc), calc(0.10 * var(--glow)));
            overflow: hidden; }
    .mods { position: absolute; inset: 16px; display: grid; gap: 10px; }
    .mods i { display: block; border-radius: 6px; border: 1.5px solid rgba(var(--acc), 0.35);
              background-color: rgba(var(--acc), 0.0); }
    .flow { position: absolute; top: 0; bottom: 0; width: 34%; left: 0;
            background: linear-gradient(90deg, rgba(var(--hi), 0) 0%, rgba(var(--hi), 0.30) 55%, rgba(var(--hi), 0) 100%); }
    .strip { position: absolute; border-radius: 6px; background-color: rgba(var(--acc), 0.9);
             box-shadow: 0 0 24px rgba(var(--acc), calc(0.9 * var(--glow))); transform-origin: 50% 50%; }
  </style>
<script>
    const { tl, D, A, T, S } = HF.boot({ portrait: "band", focus: [300, 170, 1700, 950] });
    const P = D.photo;
    const rows = HF.rows;
    const rig = HF.carRig(tl, { width: 1120, cx: 1000, floorY: P ? 545 : 470 });
    const stage = rig.stage, floorY = rig.floorY, cx = rig.cx, CW = rig.CW, car = rig.car;

    // ---- 电池包:侧视时是一条亮带(两轮之间的底板),随后落到车下方、倾斜露出模组 ----
    let packL, packR, stripY;
    if (P) {
      const cH = (P.floor - P.roof) * rig.box.h;
      packL = rig.at(P.wheels[0] + 0.07, 0)[0];
      packR = rig.at(P.wheels[1] - 0.07, 0)[0];
      stripY = floorY - 0.25 * cH;
    } else {
      packL = cx - 420; packR = cx + 420; stripY = floorY;
    }
    // 侧视亮带按真实轴距画;落下后的电池包放大到固定尺寸,模组才看得清
    const stripW = packR - packL, stripL = packL;
    const packW = 760, packH = packW * 0.42;
    const packScale0 = stripW / packW;
    packL = cx - packW / 2; packR = cx + packW / 2;
    const strip = HF.el("div", "strip");
    Object.assign(strip.style, { left: stripL + "px", top: (stripY - 7) + "px", width: stripW + "px", height: "14px" });
    stage.appendChild(strip);
    const packCY = P ? floorY + 225 : floorY + 60;
    const packwrap = HF.el("div"); packwrap.id = "packwrap";
    Object.assign(packwrap.style, { left: packL + "px", top: (packCY - packH / 2) + "px", width: packW + "px", height: packH + "px" });
    const pack = HF.el("div", "pack");
    const mods = HF.el("div", "mods");
    const COLS = 10, ROWS = 4;
    mods.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
    mods.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;
    const cells = [];
    for (let n = 0; n < COLS * ROWS; n++) { const c = HF.el("i"); mods.appendChild(c); cells.push(c); }
    const flow = HF.el("div", "flow");
    pack.appendChild(mods); pack.appendChild(flow);
    packwrap.appendChild(pack);
    stage.appendChild(packwrap);

    const vig = HF.add(HF.el("div", "vignette"));
    const head = HF.header(tl, T(0.3), { kicker: "电池" });
    const fn = HF.footnote(tl, T(1.0));

    // ---- 时间线 ----
    // 1. 开灯 + 车滑入(carRig 里排好)
    // 2. X 光扫描
    const xrayAt = T(1.15), xrayDur = Math.max(0.7, T(1.0));
    if (car) rig.xray(tl, xrayAt, xrayDur);
    // 3. 底板亮起
    const stripAt = P ? xrayAt + xrayDur * 0.55 : T(0.6);
    tl.fromTo(strip, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: T(0.5), ease: "power3.out" }, stripAt);
    // 4. 电池包落下、倾斜露出模组
    const dropAt = stripAt + T(0.5);
    const dropDur = Math.max(0.6, T(0.9));
    tl.fromTo(packwrap, { y: stripY - packCY, x: (stripL + stripW / 2) - cx, scale: P ? packScale0 : 0.9, opacity: 0 },
                        { y: 0, x: 0, scale: 1, opacity: 1, duration: dropDur, ease: "expo.inOut" }, dropAt);
    tl.fromTo(pack, { rotationX: 88, scale: 0.98 }, { rotationX: 56, scale: 1, duration: dropDur, ease: "expo.inOut" }, dropAt);
    tl.to(strip, { opacity: P ? 0.35 : 0, duration: dropDur * 0.6 }, dropAt);
    // 模组按列点亮(细线 + 低透明度填充,不是大块纯色)。有电量量程时只点亮 ratio 那么多列 ——
    // 同级里电量越大亮得越满;没有量程就整包通电,不表示多少
    const lightAt = dropAt + dropDur * 0.6;
    const capRow = HF.items(9).find((it) => it.unit === "kWh" && it.ratio != null);
    const litCols = capRow ? Math.max(1, Math.round(capRow.ratio * COLS)) : COLS;
    cells.forEach((c, n) => {
      const col = n % COLS, row = Math.floor(n / COLS);
      const on = col < litCols;
      tl.to(c, { borderColor: HF.c("acc", on ? 0.95 : 0.45), backgroundColor: HF.c("acc", on ? 0.20 : 0.0), duration: 0.18, ease: "power1.out" },
            lightAt + (col * 0.07 + row * 0.025) * A.K);
    });

    // 5. 标注:第一行是主数字(左),其余行挂在电池包右侧
    const tiltH = packH * Math.cos(56 * Math.PI / 180);
    const callouts = [];
    const coAt = lightAt + T(0.3);
    if (rows[0]) {
      const c = HF.callout({ anchor: [packL + 40, packCY], label: [packL - 70, packCY + 10],
                             side: "left", title: rows[0].label, value: rows[0].value,
                             size: HF.fitSize(rows[0].value, 400, 150) });
      callouts.push(c);
    }
    rows.slice(1, 3).forEach((r, k) => {
      const ay = packCY - tiltH / 4 + k * tiltH / 2;
      callouts.push(HF.callout({ anchor: [packR - 40 - k * 70, ay], label: [packR + 70, packCY - 85 + k * 170],
                                 side: "right", title: r.label, value: r.value,
                                 size: HF.fitSize(r.value, 330, 76) }));
    });
    // 标注铺开到整拍的 60% 处,不挤在前两秒
    const lastCo = Math.max(coAt, Math.min(A.outAt - 1.6, S * 0.6));
    // 有旁白时刻就跟着旁白走,没有就铺到整拍 60%
    const coTimes = HF.coTimes(rows, callouts.length, coAt, lastCo, A.outAt - 1.4);
    callouts.forEach((c, k) => {
      const at = coTimes[k];
      c.show(tl, at, k === 0 ? Math.max(0.9, T(1.4)) : 0.8);
      c.breathe(tl, at + 1.0, A.outAt);
    });

    // 6. 停留段:能量光带在模组上循环流动;镜头全程慢推
    const flowFrom = lightAt + T(0.6);
    HF.drive(tl, (t) => {
      const ph = (t % 1.7) / 1.7;
      flow.style.transform = `translateX(${(-40 + ph * 340).toFixed(2)}%)`;
      flow.style.opacity = String(Math.min(1, t / 0.4));
    }, flowFrom, Math.max(0.1, A.outAt - flowFrom));
    HF.camera(tl, [{ el: stage, scale: [1.0, 1.05], x: [10, -14] }]);

    // 7. 退场
    HF.exit(tl, [head, fn].concat(...callouts.map((c) => c.els)), A.outAt, A.outDur);
    tl.to([packwrap, strip], { opacity: 0, duration: A.outDur, ease: "power1.in" }, A.outAt);
    HF.grain();
    HF.register(tl);
  </script>
