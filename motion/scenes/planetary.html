<!-- Mechanism animation: a planetary gear set (sun, planets on a carrier, ring).
     mode "split"  all three members turn; the sun speed swings, so the ring speed changes
                   while the carrier (engine side) holds steady: a power-split device
     mode "reduce" ring held still, fast sun in, slow carrier out: a reduction stage
     A schematic only: tooth counts are not a real gearbox and no numbers are drawn.
     All on-screen words come from the data (words.*), this file stays ASCII.
     @portrait yes -->
<meta name="hf-bg" content="studio" />
<style>
    .pg-lab { font-size: 30px; font-weight: 700; }
    .pg-sub { font-size: 24px; fill: rgba(var(--ink), 0.7); }
  </style>
<script>
    const { tl, D, S } = HF.boot();
    const M = HF.mech(tl);
    const sv = M.svg, W = D.words || {};
    const mode = D.mode === "reduce" ? "reduce" : "split";
    const defs = HF.svg("defs", {}, sv);
    const cp = HF.svg("clipPath", { id: "pg-clip" }, defs);
    HF.svg("rect", { x: 0, y: 0, width: 632, height: 640 }, cp);
    const clipG = HF.svg("g", { "clip-path": "url(#pg-clip)" }, sv);
    const stage = HF.svg("g", {}, clipG);
    const CAMS = [null, [330, 320, 1.0, 1.18], [330, 260, 1.2, 1.06], [350, 360, 1.12, 1.0]];
    const cam = CAMS[(D.variant || 0) % CAMS.length];
    if (cam) {
      stage.style.transformOrigin = cam[0] + "px " + cam[1] + "px";
      tl.fromTo(stage, { scale: cam[2] }, { scale: cam[3], duration: S, ease: "none" }, 0);
    }
    const SUN = HF.c("hi"), CAR = HF.c("acc"), RING = HF.c("acc2");
    const CX = 330, CY = 320, MOD = 8, NS = 24, NP = 18, NR = 60;
    const RS = MOD * NS / 2, RP = MOD * NP / 2, RR = MOD * NR / 2, RC = RS + RP;

    // toothed outline around (0,0): external teeth point out, internal teeth point in
    const gearPath = (n, r, internal) => {
      const add = internal ? -MOD * 0.8 : MOD * 0.8, ded = internal ? MOD * 0.9 : -MOD * 0.9;
      const p = Math.PI * 2 / n; let d = "";
      for (let k = 0; k < n; k++) {
        const a = k * p;
        const pts = [[a - p * 0.25, r + ded], [a - p * 0.14, r + add], [a + p * 0.14, r + add], [a + p * 0.25, r + ded]];
        pts.forEach((q, i) => { d += (k === 0 && i === 0 ? "M" : "L") + (Math.cos(q[0]) * q[1]).toFixed(1) + " " + (Math.sin(q[0]) * q[1]).toFixed(1) + " "; });
      }
      return d + "Z";
    };
    const circlePath = (r) => "M" + r + " 0 A" + r + " " + r + " 0 1 0 " + (-r) + " 0 A" + r + " " + r + " 0 1 0 " + r + " 0 Z";
    const place = (g, x, y, deg) => g.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + deg.toFixed(2) + ")");

    // ring: an annulus with internal teeth
    const ring = HF.svg("g", {}, stage);
    HF.svg("path", { d: circlePath(RR + 34) + " " + gearPath(NR, RR, true), "fill-rule": "evenodd", fill: HF.c("acc2", 0.16), stroke: RING, "stroke-width": 3, "stroke-linejoin": "round" }, ring);
    HF.svg("circle", { cx: RR + 18, cy: 0, r: 7, fill: RING }, ring);
    // carrier: three arms under the planets
    const carrier = HF.svg("g", {}, stage);
    const TH = [0, 1, 2].map((k) => k * Math.PI * 2 / 3);
    HF.svg("path", { d: "M" + TH.map((a) => (Math.cos(a) * RC).toFixed(1) + " " + (Math.sin(a) * RC).toFixed(1)).join(" L") + " Z", fill: HF.c("acc", 0.10), stroke: CAR, "stroke-width": 12, "stroke-linejoin": "round" }, carrier);
    // sun
    const sun = HF.svg("g", {}, stage);
    HF.svg("path", { d: gearPath(NS, RS, false), fill: HF.c("hi", 0.20), stroke: SUN, "stroke-width": 3, "stroke-linejoin": "round" }, sun);
    HF.svg("circle", { cx: 0, cy: 0, r: 26, fill: HF.c("bg", 0.9), stroke: SUN, "stroke-width": 4 }, sun);
    HF.svg("line", { x1: 30, y1: 0, x2: RS - 22, y2: 0, stroke: SUN, "stroke-width": 6, "stroke-linecap": "round" }, sun);
    // planets
    const planets = TH.map(() => {
      const g = HF.svg("g", {}, stage);
      HF.svg("path", { d: gearPath(NP, RP, false), fill: HF.c("ink", 0.14), stroke: HF.c("ink", 0.8), "stroke-width": 3, "stroke-linejoin": "round" }, g);
      HF.svg("circle", { cx: 0, cy: 0, r: 16, fill: CAR }, g);
      HF.svg("line", { x1: 20, y1: 0, x2: RP - 20, y2: 0, stroke: HF.c("ink", 0.7), "stroke-width": 5, "stroke-linecap": "round" }, g);
      return g;
    });

    // legend with a live speed bar per member (unscaled in sv so labels never clip)
    const ROLE = mode === "split" ? [W.generator, W.engine, W.wheels] : [W.motor, W.wheels, W.held];
    const rowsDef = [[W.sun, ROLE[0], SUN], [W.carrier, ROLE[1], CAR], [W.ring, ROLE[2], RING]];
    const BAR_W = 290;
    const bars = rowsDef.map((r, k) => {
      const y = 150 + k * 150;
      HF.svg("circle", { cx: 662, cy: y - 10, r: 11, fill: r[2] }, sv);
      const t = HF.svg("text", { x: 686, y: y, class: "pg-lab", fill: HF.c("ink") }, sv); t.textContent = r[0] || "";
      const s = HF.svg("text", { x: 650 + BAR_W, y: y, "text-anchor": "end", class: "pg-sub" }, sv); s.textContent = r[1] || "";
      HF.svg("rect", { x: 650, y: y + 22, width: BAR_W, height: 14, rx: 7, fill: HF.c("ink", 0.12) }, sv);
      return HF.svg("rect", { x: 650, y: y + 22, width: 0, height: 14, rx: 7, fill: r[2] }, sv);
    });
    const spd = HF.svg("text", { x: 650, y: 90, class: "pg-sub" }, sv); spd.textContent = W.speed || "";

    // angles are closed-form in t, so seeking to any frame gives the same picture
    const DEG = 180 / Math.PI;
    HF.drive(tl, (t) => {
      let c, s, wc, ws;
      if (mode === "split") {
        wc = 0.9; c = wc * t;
        ws = 0.9 + 1.5 * Math.sin(t * 0.9); s = 0.9 * t + (1.5 / 0.9) * (1 - Math.cos(t * 0.9));
      } else {
        ws = 2.6; s = ws * t;
        wc = ws * NS / (NS + NR); c = wc * t;
      }
      const r = (c * (NS + NR) - s * NS) / NR, wr = (wc * (NS + NR) - ws * NS) / NR;
      place(ring, CX, CY, r * DEG);
      place(carrier, CX, CY, c * DEG);
      place(sun, CX, CY, s * DEG);
      planets.forEach((g, k) => {
        const a = c + TH[k];
        const rot = c + TH[k] + Math.PI + Math.PI / NP - (s - c) * NS / NP;
        place(g, CX + Math.cos(a) * RC, CY + Math.sin(a) * RC, rot * DEG);
      });
      [ws, wc, wr].forEach((w, k) => bars[k].setAttribute("width", Math.max(0, Math.min(BAR_W, Math.abs(w) / 2.8 * BAR_W)).toFixed(1)));
    }, 0, S);
    HF.grain();
    HF.register(tl);
  </script>
