<!-- @name 发布会格子
     @desc 发布会式圆角格子拼盘,大格放标题,小格各放一个参数,依次弹出、彩色光晕缓慢流动
     @order 5 -->
<meta name="hf-photo" content="scene" />
<style>
    html, body { background: #000; }
    #root { background: #000; color: #f5f5f7;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .board { position: absolute; left: 96px; top: 96px; width: 1728px; height: 888px; display: grid; gap: 24px;
             grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
    .tile { position: relative; border-radius: 36px; background: #141416; overflow: hidden; border: 1px solid rgba(255,255,255,0.07); }
    .tile .glow { position: absolute; width: 520px; height: 520px; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
    .tile .in { position: absolute; left: 44px; right: 44px; bottom: 40px; }
    .tile .lab { font-size: 30px; font-weight: 600; color: rgba(245,245,247,0.6); }
    .tile .val { margin-top: 6px; font-family: "Inter", sans-serif; font-weight: 800; letter-spacing: -0.04em; line-height: 1; white-space: nowrap;
                 background: linear-gradient(120deg, #fff 30%, var(--c) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 6px; }
    .tile .b { margin-top: 10px; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 30px; font-weight: 700; color: rgba(245,245,247,0.55); white-space: nowrap; }
    .tile .tag { position: absolute; left: 44px; top: 40px; font-size: 22px; font-weight: 600; color: var(--c); letter-spacing: 0.06em; }
    .main .kick { position: absolute; left: 52px; top: 52px; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 28px; font-weight: 700; color: rgba(245,245,247,0.6); letter-spacing: 0.1em; }
    .main .ttl { position: absolute; left: 52px; right: 52px; bottom: 52px; font-weight: 800; line-height: 1.1; }
    .main .photo { position: absolute; display: block; }
    .src { position: absolute; right: 120px; bottom: 40px; font-size: 20px; color: rgba(245,245,247,0.4); }
  </style>
<script>
    const { tl, D, add, items, A, T, S } = HF.boot();
    const P = D.photo;
    const hues = ["#5ac8fa", "#bf5af2", "#ff9f0a", "#30d158", "#ff375f"];

    const board = add(HF.el("div", "board"));
    // 格子布局:大格 2×2;参数 1~2 个时每个占 2×1,3~4 个时 1×1
    const main = HF.el("div", "tile main"); main.style.gridColumn = "1 / 3"; main.style.gridRow = "1 / 3";
    board.appendChild(main);
    const mg = HF.el("div", "glow"); Object.assign(mg.style, { left: "-120px", top: "-160px", background: hues[0] }); main.appendChild(mg);
    main.appendChild(HF.el("div", "kick", [D.subject, HF.kicker].filter(Boolean).join("  ·  ")));
    const ttl = HF.el("div", "ttl", D.title || ""); ttl.style.fontSize = HF.fit(D.title || "", 1300, 110) + "px"; main.appendChild(ttl);
    if (P) {
      const ph = HF.photoImg("photo"); const pw = 760, hh = pw * P.height / P.width;
      Object.assign(ph.style, { width: pw + "px", height: hh + "px", left: "50px", top: (520 - P.floor * hh) + "px" });
      main.appendChild(ph);
      tl.fromTo(ph, { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 1.0, ease: "expo.out" }, 0.4);
      tl.fromTo(ph, { scale: 1 }, { scale: 1.05, duration: S, ease: "none" }, 0);
    }
    const tiles = [main], glows = [mg];
    items.forEach((it, k) => {
      const t = HF.el("div", "tile"); const c = hues[(k + 1) % hues.length];
      t.style.setProperty("--c", c);
      if (items.length <= 2) { t.style.gridColumn = "3 / 5"; t.style.gridRow = String(k + 1); }
      if (items.length === 3 && k === 2) t.style.gridColumn = "3 / 5";
      const g = HF.el("div", "glow"); Object.assign(g.style, { right: "-260px", top: "-300px", background: c }); t.appendChild(g); glows.push(g);
      if (it.tag) t.appendChild(HF.el("div", "tag", it.tag));
      const inn = HF.el("div", "in"); t.appendChild(inn);
      inn.appendChild(HF.el("div", "lab", it.label));
      const wide = items.length <= 2 || (items.length === 3 && k === 2);
      const val = HF.el("div", "val"); val.style.fontSize = HF.fit(it.value, wide ? 720 : 300, wide ? 150 : 100, 1.08) + "px"; inn.appendChild(val);
      if (it.b) inn.appendChild(HF.el("div", "b", HF.cols[1] + "  " + it.b));
      board.appendChild(t); tiles.push(t);
      t._val = val; t._txt = it.value;
    });
    const t0 = 0.1, step = Math.min(0.22, Math.max(0.08, (Math.min(A.outAt - 1.2, S * 0.4) - t0) / Math.max(1, tiles.length)));
    tiles.forEach((t, k) => {
      const at = t0 + k * step * (k ? 1.6 : 1);
      tl.fromTo(t, { scale: 0.86, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)" }, at);
      if (t._val) HF.countText(tl, t._val, t._txt, at + 0.25, 1.1);
    });
    tl.fromTo(Array.from(main.children).filter((e) => e.className === "kick" || e.className === "ttl"),
      { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.3);
    // 停留:每格的光晕慢慢绕圈
    HF.drive(tl, (t) => {
      glows.forEach((g, k) => {
        const a = t * 0.6 + k * 1.7;
        g.style.transform = `translate(${(Math.cos(a) * 90).toFixed(1)}px, ${(Math.sin(a) * 60).toFixed(1)}px)`;
      });
    }, 0, S);
    const src = add(HF.el("div", "src", D.source || ""));
    tl.fromTo(src, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);
    tl.to(tiles.slice().reverse(), { opacity: 0, scale: 0.94, duration: A.outDur, ease: "power2.in", stagger: 0.03 }, A.outAt);
    tl.to(src, { opacity: 0, duration: A.outDur }, A.outAt);
    HF.register(tl);
  </script>
