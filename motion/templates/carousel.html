<!-- @name 3D 卡片轮播
     @desc 紫色夜空里一圈立体卡片,转盘式旋转把每张参数卡依次转到正前方
     @order 11
     @sample 6.2
     @portrait yes -->
<style>
    html, body { background: #0d0620; }
    #root { color: #fff;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(ellipse 1300px 800px at 960px 640px, #3a1670 0%, #160a33 55%, #08031a 100%); }
    .stars { position: absolute; inset: 0; }
    .stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; }
    .hd { position: absolute; left: 0; right: 0; top: 76px; text-align: center; }
    .hd .k { font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 24px; font-weight: 600; letter-spacing: 0.35em; color: #c9a7ff; }
    .hd .t { margin-top: 10px; font-size: 60px; font-weight: 800; letter-spacing: 0.06em; white-space: nowrap; }
    .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; perspective: 2200px; perspective-origin: 960px 420px; }
    .ring { position: absolute; left: 960px; top: 620px; transform-style: preserve-3d; }
    .card { position: absolute; width: 520px; height: 560px; left: -260px; top: -280px; border-radius: 34px; padding: 50px 46px;
            background: linear-gradient(160deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.04) 60%);
            border: 2px solid rgba(220,190,255,0.45); box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 0 60px rgba(180,120,255,0.15);
            backface-visibility: hidden; }
    .card .no { font-family: "Inter", sans-serif; font-size: 30px; font-weight: 800; color: #c9a7ff; }
    .card .lab { margin-top: 110px; font-size: 40px; font-weight: 700; }
    .card .val { margin-top: 14px; font-family: "Montserrat", sans-serif; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; line-height: 1.05;
                 background: linear-gradient(90deg, #fff 0%, #e2c8ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .card .b { margin-top: 18px; font-family: "Montserrat", "Noto Sans SC", sans-serif; font-size: 34px; font-weight: 700; color: #ffcf6e; white-space: nowrap; }
    .card .tag { position: absolute; left: 46px; bottom: 46px; font-size: 24px; color: rgba(255,255,255,0.55); }
    .card.title .big { margin-top: 90px; font-weight: 800; line-height: 1.15; }
    .card.title .sub { margin-top: 26px; font-size: 30px; color: rgba(255,255,255,0.6); }
    .floor { position: absolute; left: 360px; top: 880px; width: 1200px; height: 160px; border-radius: 50%;
             background: radial-gradient(ellipse at center, rgba(190,130,255,0.35) 0%, rgba(190,130,255,0) 70%); }
    .src { position: absolute; right: 90px; bottom: 50px; font-size: 22px; color: rgba(255,255,255,0.4); }
    /* portrait: ring centred lower in the frame, slightly smaller cards */
    [data-aspect=portrait] .hd { top: 236px; }
    [data-aspect=portrait] .scene { width: 1080px; height: 1920px; perspective-origin: 540px 760px; }
    [data-aspect=portrait] .ring { left: 540px; top: 900px; }
    [data-aspect=portrait] .card { width: 480px; height: 580px; left: -240px; top: -290px; }
    [data-aspect=portrait] .floor { left: 90px; top: 1180px; width: 900px; }
    [data-aspect=portrait] .src { right: 64px; bottom: auto; top: 1494px; }
  </style>
<script>
    const { tl, D, add, items, A, T, S } = HF.boot({ items: 5 });
    const PT = HF.portrait;

    const stars = add(HF.el("div", "stars")); const rng = HF.rng(11); const starEls = [];
    for (let k = 0; k < 90; k++) { const s = HF.el("i"); s.style.left = (rng() * HF.W) + "px"; s.style.top = (rng() * (PT ? 1500 : 700)) + "px";
      s.style.opacity = String(0.2 + rng() * 0.6); s._ph = rng() * 6; stars.appendChild(s); starEls.push(s); }
    const hd = add(HF.el("div", "hd"));
    hd.appendChild(HF.el("div", "k", [D.subject, HF.kicker].filter(Boolean).join("  ·  ")));
    const ht = hd.appendChild(HF.el("div", "t", D.title || ""));
    if (PT) ht.style.fontSize = HF.fit(D.title || "", 940, 60) + "px";
    tl.fromTo(hd.children, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.1);
    add(HF.el("div", "floor"));

    const scene = add(HF.el("div", "scene")); const ring = HF.el("div", "ring"); scene.appendChild(ring);
    // 卡片:标题卡 + 每行一张;不足 4 张补空卡让环看起来完整
    const cards = [];
    const tc = HF.el("div", "card title"); tc.appendChild(HF.el("div", "no", HF.kicker || "SPEC"));
    const big = HF.el("div", "big", D.title || ""); big.style.fontSize = HF.fit(D.title || "", 860, 76) + "px"; tc.appendChild(big);
    tc.appendChild(HF.el("div", "sub", D.subject || "")); cards.push({ el: tc });
    items.forEach((it, k) => {
      const c = HF.el("div", "card"); c.appendChild(HF.el("div", "no", String(k + 1).padStart(2, "0")));
      c.appendChild(HF.el("div", "lab", it.label));
      const v = HF.el("div", "val"); v.style.fontSize = HF.fit(it.value, PT ? 380 : 410, 116, 1.08) + "px"; c.appendChild(v);
      if (it.b) c.appendChild(HF.el("div", "b", HF.cols[1] + "  " + it.b));
      if (it.tag) c.appendChild(HF.el("div", "tag", it.tag));
      cards.push({ el: c, v, txt: it.value });
    });
    const real = cards.length;
    while (cards.length < 6) { const c = HF.el("div", "card"); c.style.opacity = "0.5"; cards.push({ el: c, blank: true }); }
    cards.forEach((c) => ring.appendChild(c.el));
    const N = cards.length, step = 360 / N, R = (PT ? 240 : 260) / Math.tan(Math.PI / N) + (PT ? 60 : 120);

    // 转盘角度:每张真卡一段,段首 0.8 秒转到正前方,其余时间停住微微晃
    const t0 = T(0.5), L = (A.outAt - t0) / real;
    const ease = gsap.parseEase("power3.inOut");
    const angleAt = (t) => {
      if (t < t0) return 30 * (1 - Math.min(1, t / t0));
      const k = Math.min(real - 1, Math.floor((t - t0) / L)), u = t - t0 - k * L;
      const rot = Math.min(0.9, L * 0.45), p = k === 0 ? 1 : ease(Math.min(1, u / rot));
      return -step * (k - 1 + p) + Math.sin(t * 1.3) * 2.5;
    };
    HF.drive(tl, (t) => {
      const a0 = angleAt(t);
      ring.style.transform = `translateZ(${-R}px) rotateY(${a0.toFixed(2)}deg)`;
      cards.forEach((c, k) => {
        const a = k * step, rel = ((a + a0) % 360 + 540) % 360 - 180;
        c.el.style.transform = `rotateY(${a}deg) translateZ(${R}px)`;
        const front = Math.cos(rel * Math.PI / 180);
        c.el.style.filter = `brightness(${(0.45 + 0.55 * Math.max(0, front)).toFixed(3)})`;
      });
      starEls.forEach((s) => { s.style.transform = `translateX(${(-t * 14).toFixed(1)}px)`; });
    }, 0, S);
    tl.fromTo(scene, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 0.1);
    cards.slice(1, real).forEach((c, k) => HF.countText(tl, c.v, c.txt, t0 + (k + 1) * L + 0.2, Math.min(1.0, L * 0.5)));
    const src = add(HF.el("div", "src", D.source || ""));
    tl.fromTo(src, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);
    HF.exit(tl, [hd, scene, src], A.outAt, A.outDur);
    HF.register(tl);
  </script>
