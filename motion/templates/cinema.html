<!-- @name 发布会暗场
     @desc 发布会式暗场:顶光、浮尘、场景画面(电池包 / 充电曲线 / 零百表…)居中,镜头跟着旁白推到正在讲的部位,大号细体数字逐位滚出
     @order 1
     @sample 5.6
     @portrait yes -->
<meta name="hf-photo" content="scene" />
<style>
    :root { --acc: 132, 206, 255; --hi: 228, 246, 255; --acc2: 255, 186, 110; --hi2: 255, 236, 210;
            --ink: 240, 238, 232; --bg: 6, 7, 9; --glow: 1; }
    html, body { background: #060709; }
    #root { background: #060709; color: rgb(var(--ink));
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .stage { position: absolute; inset: 0;
             background: radial-gradient(ellipse 1300px 760px at 62% 18%, #1a1f27 0%, #0b0d11 48%, #060709 100%); }
    .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
             background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(132,206,255,0.05) 100%); }
    .beam { position: absolute; top: -200px; width: 520px; height: 1500px; transform-origin: 50% 0;
            background: linear-gradient(180deg, rgba(var(--hi), 0.16) 0%, rgba(var(--hi), 0.04) 55%, rgba(var(--hi), 0) 100%);
            filter: blur(30px); mix-blend-mode: screen; }
    .dust { position: absolute; border-radius: 50%; background: rgba(var(--hi), 0.5); }
    .car { position: absolute; display: block; filter: brightness(0.42) contrast(1.2) saturate(0.6); }
    .rim { position: absolute; display: block; filter: brightness(2.2) saturate(0) blur(1px); mix-blend-mode: screen; }
    .cam { position: absolute; inset: 0; }
    .kick { position: absolute; left: 120px; top: 108px; font-family: "Montserrat", "Noto Sans SC", sans-serif;
            font-size: 22px; font-weight: 600; letter-spacing: 0.42em; color: rgba(var(--ink), 0.55); white-space: nowrap; }
    .kick b { color: rgb(var(--acc)); font-weight: 600; }
    .ttl-m { position: absolute; left: 116px; top: 146px; overflow: hidden; padding-bottom: 8px; }
    .ttl { font-weight: 900; line-height: 1.08; letter-spacing: 0.02em; white-space: nowrap; }
    .rule { position: absolute; left: 120px; height: 1px; width: 560px; background: rgba(var(--ink), 0.18); transform-origin: 0 50%; }
    .now { position: absolute; left: 120px; width: 700px; }
    .now .lab { font-size: 30px; font-weight: 500; letter-spacing: 0.24em; color: rgba(var(--ink), 0.72); }
    .now .num-m { position: relative; margin-top: 10px; overflow: hidden; padding: 0 8px 6px 0; }
    .now .num { color: rgba(var(--ink), 0.9); font-family: "Montserrat", sans-serif; font-weight: 300; letter-spacing: -0.03em; line-height: 1; white-space: nowrap;
                font-variant-numeric: tabular-nums; display: flex; align-items: baseline; }
    .now .roll-unit { font-weight: 500; font-size: 0.3em; margin-left: 14px; color: rgba(var(--ink), 0.66); letter-spacing: 0; }
    .now .roll-head { font-size: 0.3em; font-weight: 500; color: rgba(var(--ink), 0.66); margin-right: 10px; }
    .now .roll-tag { font-family: "Noto Sans SC", sans-serif; font-size: 0.17em; font-weight: 600; margin-left: 18px; align-self: center;
                     padding: 6px 16px; border: 1.5px solid rgba(var(--acc), 0.5); border-radius: 999px; color: rgb(var(--acc)); letter-spacing: 0.04em; }
    .now .b { margin-top: 10px; font-size: 28px; color: rgba(var(--ink), 0.6); white-space: nowrap; }
    .now .b em { font-style: normal; color: rgb(var(--acc2)); margin-right: 12px; }
    .now .tag { margin-top: 14px; font-size: 22px; color: rgba(var(--ink), 0.45); letter-spacing: 0.06em; white-space: nowrap; }
    .hist { position: absolute; left: 120px; display: flex; flex-direction: column; gap: 12px; }
    .hist .h { display: flex; align-items: baseline; gap: 18px; white-space: nowrap; }
    .hist .h span { font-size: 22px; letter-spacing: 0.16em; color: rgba(var(--ink), 0.5); min-width: 150px; }
    .hist .h b { font-family: "Montserrat", "Noto Sans SC", sans-serif; font-weight: 500; font-size: 34px; color: rgba(var(--ink), 0.9); }
    .src { position: absolute; right: 120px; bottom: 76px; font-size: 20px; letter-spacing: 0.2em; color: rgba(var(--ink), 0.36); white-space: nowrap; }
    .bar { position: absolute; left: 0; right: 0; height: 64px; background: #000; }
    [data-aspect=portrait] .kick { left: 64px; top: 236px; font-size: 20px; letter-spacing: 0.3em; }
    [data-aspect=portrait] .ttl-m { left: 60px; top: 272px; }
    [data-aspect=portrait] .rule { left: 64px; width: 952px; }
    [data-aspect=portrait] .now { left: 64px; width: 952px; }
    [data-aspect=portrait] .hist { left: 64px; }
    [data-aspect=portrait] .src { right: 64px; bottom: auto; top: 1490px; }
    [data-aspect=portrait] .bar { display: none; }
  </style>
<script>
    const { tl, D, add, items, A, T, S } = HF.boot();
    const P = D.photo, PT = HF.portrait, scene = D.scene || "";

    // ---- 舞台:顶光两束 + 浮尘 ----
    const stage = add(HF.el("div", "stage"));
    add(HF.el("div", "floor"));
    const beams = [[PT ? 640 : 1180, -14], [PT ? 260 : 1500, 12]].map(([x, r]) => {
      const b = add(HF.el("div", "beam")); b.style.left = (x - 260) + "px"; b._r = r; return b; });
    const rnd = HF.rng(4), dust = [];
    for (let k = 0; k < 40; k++) {
      const d = add(HF.el("div", "dust")); const s = 2 + rnd() * 3;
      Object.assign(d.style, { width: s + "px", height: s + "px", left: (rnd() * HF.W) + "px", top: (rnd() * HF.H) + "px", opacity: (0.15 + rnd() * 0.5).toFixed(2) });
      d._v = 8 + rnd() * 18; d._p = rnd() * 6; dust.push(d);
    }
    HF.drive(tl, (t) => {
      beams.forEach((b, k) => { b.style.transform = `rotate(${(b._r + Math.sin(t * 0.5 + k * 2) * 4).toFixed(2)}deg)`; });
      dust.forEach((d) => { d.style.transform = `translate(${(Math.sin(t * 0.6 + d._p) * 14).toFixed(1)}px, ${(-t * d._v).toFixed(1)}px)`; });
    }, 0, S);
    tl.fromTo([stage, ...beams], { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power1.out" }, 0);

    // ---- 镜头层:场景画面 + 暗场里的车 ----
    const cam = add(HF.el("div", "cam"));
    const vb = PT ? { x: 110, y: 570, w: 860, h: 540 } : { x: 860, y: 170, w: 940, h: 700 };
    cam.style.transformOrigin = `${vb.x + vb.w / 2}px ${vb.y + vb.h / 2}px`;
    if (P && !["dims", "lidar", "compare"].includes(scene)) {
      // 车在暗处,只有轮廓被顶光勾出来:讲的是车里看不见的东西
      const cw = PT ? 1000 : 1240, chh = cw * P.height / P.width;
      const left = PT ? 40 : 700, top = (PT ? 1130 : 990) - P.floor * chh;
      [["car", 1], ["rim", 0.22]].forEach(([cls, op]) => {
        const im = HF.photoImg(cls); Object.assign(im.style, { width: cw + "px", height: chh + "px", left: left + "px", top: top + "px" });
        if (P.facing === "left") im.style.transform = "scaleX(-1)";
        cam.appendChild(im);
        tl.fromTo(im, { opacity: 0 }, { opacity: cls === "car" ? 0.32 : op * 0.5, duration: 1.6, ease: "power1.inOut" }, 0.2);
      });
    }
    const viz = HF.viz.make(scene, vb, items, { glow: 1 });
    if (viz) cam.appendChild(viz.host);

    // ---- 标题 ----
    const kick = add(HF.el("div", "kick"));
    kick.innerHTML = "";
    kick.appendChild(document.createTextNode((D.subject || "") + "   "));
    kick.appendChild(HF.el("b", "", HF.kicker || ""));
    const tm = add(HF.el("div", "ttl-m"));
    const ttl = HF.el("div", "ttl", D.title || ""); tm.appendChild(ttl);
    ttl.style.fontSize = HF.fit(D.title || "", PT ? 950 : 700, PT ? 96 : 84) + "px";
    HF.reveal(tl, kick, "blur", 0.25, 0.8);
    HF.reveal(tl, ttl, "rise", 0.4, 0.8);
    const ruleY = PT ? 400 : 290;
    const rule = add(HF.el("div", "rule")); rule.style.top = ruleY + "px";
    tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.inOut" }, 0.6);

    // ---- 参数:当前这一条大字,讲过的收进上方小列表 ----
    const nowTop = PT ? 1190 : 520;
    const histTop = PT ? 430 : 330;
    const hist = add(HF.el("div", "hist")); hist.style.top = histTop + "px";
    const t0 = T(1.3), t1 = Math.max(t0, A.outAt - 1.4);
    const at = HF.beats(items, t0, t1, Math.min(1.4, Math.max(0.9, (t1 - t0) / Math.max(1, items.length))));
    const order = items.map((_, k) => k).sort((a, b) => at[a] - at[b]);
    const blocks = [];
    order.forEach((k, n) => {
      const it = items[k], when = at[k];
      const blk = add(HF.el("div", "now")); blk.style.top = nowTop + "px";
      blk.appendChild(HF.el("div", "lab", it.label));
      const m = HF.el("div", "num-m"); const num = HF.el("div", "num"); m.appendChild(num); blk.appendChild(m);
      num.style.fontSize = HF.fitSize(it.value, PT ? 900 : 680, PT ? 220 : 210) + "px";
      if (it.b) { const b = HF.el("div", "b"); b.appendChild(HF.el("em", "", HF.cols[1] || "")); b.appendChild(document.createTextNode(it.b)); blk.appendChild(b); }
      if (it.tag) blk.appendChild(HF.el("div", "tag", it.tag));
      tl.set(blk, { opacity: 0 }, 0);
      tl.set(blk, { opacity: 1 }, when);
      HF.reveal(tl, blk.firstChild, "blur", when, 0.6);
      HF.roll(tl, num, it.value, when + 0.1, 1.1);
      tl.fromTo(num, { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, when + 0.1);
      Array.from(blk.children).slice(2).forEach((e, j) => HF.reveal(tl, e, "wipe", when + 0.5 + j * 0.1, 0.6));
      // 数字落定时亮一下(只亮字形本身)
      tl.fromTo(num, { textShadow: "0 0 0px rgba(132,206,255,0)" }, { textShadow: "0 0 28px rgba(132,206,255,0.85)", duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, when + 1.0);
      // 下一条进来时,这一条收进上方列表
      const next = order[n + 1];
      // 对比镜:条形图里已经列着每一行,不再收进列表
      if (next != null) tl.to(blk, { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.45, ease: "power2.in" }, at[next] - 0.05);
      if (next != null && scene !== "compare") {
        const leave = at[next] - 0.05;
        const h = HF.el("div", "h"); h.appendChild(HF.el("span", "", it.label)); h.appendChild(HF.el("b", "", it.value + (it.b ? "  /  " + it.b : "")));
        hist.appendChild(h);
        tl.set(h, { opacity: 0 }, 0);
        tl.fromTo(h, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, leave + 0.2);
      }
      blocks.push(blk);
    });

    // ---- 画面与镜头:开场全景 → 每讲一条推到对应部位 ----
    if (viz) {
      viz.show(tl, 0.5);
      const keys = [{ at: 0, scale: 0.92, x: 0, y: 30 }, { at: 0.5, scale: 1, x: 0, y: 0 }];
      order.forEach((k) => {
        const p = viz.hit(tl, items[k], at[k] + 0.15) || [vb.w / 2, vb.h / 2];
        // 把这个部位往画面中心拉一点,并推近
        const dx = (vb.w / 2 - p[0]) * 0.35, dy = (vb.h / 2 - p[1]) * 0.35;
        keys.push({ at: Math.max(0.6, at[k] - 0.2), scale: PT ? 1.05 : 1.1, x: dx, y: dy });
      });
      if (keys.length > 2) keys.push({ at: Math.max(keys[keys.length - 1].at + 1.0, A.outAt - 1.0), scale: 1.0, x: 0, y: 0 });
      HF.shots(tl, cam, keys, { move: 1.0 });
      viz.idle(tl, 1.2, A.outAt);
    }

    // ---- 遮幅 + 出处 ----
    if (!PT) {
      const top = add(HF.el("div", "bar")), bot = add(HF.el("div", "bar"));
      top.style.top = "0"; bot.style.bottom = "0";
      tl.fromTo(top, { yPercent: -100 }, { yPercent: 0, duration: 1.0, ease: "expo.out" }, 0);
      tl.fromTo(bot, { yPercent: 100 }, { yPercent: 0, duration: 1.0, ease: "expo.out" }, 0);
    }
    const src = add(HF.el("div", "src", D.source || ""));
    HF.reveal(tl, src, "fade", 1.4, 0.8);

    // ---- 退场:文字失焦散去,镜头再推一点 ----
    HF.exit(tl, [kick, tm, rule, hist, ...blocks, src], A.outAt, A.outDur);
    tl.to(cam, { opacity: 0, duration: A.outDur, ease: "power1.in" }, A.outAt);
    HF.register(tl);
  </script>
