<!-- @name 仪表盘
     @desc 深蓝座舱风,每个参数一块环形仪表,刻度点亮、指针扫到位、数字跳动
     @order 2
     @portrait yes -->
<style>
    html, body { background: #050d1a; }
    #root { color: #e8f3ff;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(ellipse 1400px 800px at 960px 620px, #0d2240 0%, #050d1a 70%); }
    .grid { position: absolute; inset: 0; opacity: 0.5;
            background-image: linear-gradient(rgba(80,160,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(80,160,255,0.06) 1px, transparent 1px);
            background-size: 60px 60px; }
    .hd { position: absolute; left: 110px; top: 84px; }
    .kick { font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 24px; font-weight: 600; letter-spacing: 0.3em; color: #36c5ff; }
    .ttl { margin-top: 12px; font-size: 68px; font-weight: 800; letter-spacing: 0.02em; white-space: nowrap; }
    .src { position: absolute; right: 110px; top: 96px; font-size: 22px; color: rgba(232,243,255,0.5); letter-spacing: 0.08em; }
    .g { position: absolute; }
    .g svg { position: absolute; left: 0; top: 0; overflow: visible; }
    .g .num { position: absolute; left: 0; right: 0; text-align: center; font-family: "Montserrat", sans-serif; font-weight: 700;
              letter-spacing: -0.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .g .b { position: absolute; left: 0; right: 0; text-align: center; font-family: "Montserrat", "Noto Sans SC", sans-serif;
            font-weight: 600; color: #ffb547; white-space: nowrap; }
    .g .lab { position: absolute; left: -60px; right: -60px; text-align: center; font-size: 32px; font-weight: 600; letter-spacing: 0.08em; white-space: nowrap; }
    .g .tag { position: absolute; left: -60px; right: -60px; text-align: center; font-size: 22px; color: rgba(232,243,255,0.5); white-space: nowrap; }
    .legend { position: absolute; left: 0; right: 0; bottom: 86px; display: flex; justify-content: center; gap: 60px;
              font-size: 26px; color: rgba(232,243,255,0.75); }
    [data-aspect=portrait] .hd { left: 64px; top: 230px; }
    [data-aspect=portrait] .ttl { font-size: 60px; }
    [data-aspect=portrait] .src { right: auto; left: 64px; top: 380px; }
    [data-aspect=portrait] .legend { bottom: auto; top: 1450px; }
    .legend span::before { content: ""; display: inline-block; width: 28px; height: 6px; border-radius: 3px; margin-right: 14px; vertical-align: middle; background: var(--c); }
  </style>
<script>
    const { tl, D, add, items, A, T, S } = HF.boot();
    const CA = "#36c5ff", CB = "#ffb547";

    const grid = add(HF.el("div", "grid"));
    const hd = add(HF.el("div", "hd"));
    hd.appendChild(HF.el("div", "kick", [D.subject, HF.kicker].filter(Boolean).join(" · ")));
    const ttl = HF.el("div", "ttl", D.title || ""); hd.appendChild(ttl);
    const src = add(HF.el("div", "src", D.source || ""));
    tl.fromTo(grid, { opacity: 0 }, { opacity: 0.5, duration: 0.8 }, 0);
    tl.fromTo(hd.children, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 0.1);
    tl.fromTo(src, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.4);

    // 仪表:270° 弧,底部开口
    const n = Math.max(1, items.length);
    const R = n <= 2 ? 210 : n === 3 ? 185 : 160;
    const gap = n <= 2 ? 200 : n === 3 ? 120 : 70;
    const W = 2 * R, totalW = n * W + (n - 1) * gap, x0 = (1920 - totalW) / 2, cy = 600;
    // 竖屏:一个居中放大;两个上下摞;三、四个排成两列(第三个居中)
    const PT = HF.portrait;
    const PR = n === 1 ? 250 : n === 2 ? 200 : 180;
    const place = (k) => {
      if (n === 1) return [540, 860];
      if (n === 2) return [540, 650 + k * 500];
      const row = Math.floor(k / 2), lone = n === 3 && k === 2;
      return [lone ? 540 : (k % 2 ? 790 : 290), 640 + row * 500];
    };
    const a0 = 135, sweep = 270;
    const RR = PT ? PR : R;
    const pt = (r, deg) => [RR + r * Math.cos(deg * Math.PI / 180), RR + r * Math.sin(deg * Math.PI / 180)];
    const arc = (r, d0, d1) => { const [x1, y1] = pt(r, d0), [x2, y2] = pt(r, d1);
      return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${d1 - d0 > 180 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
    const exitEls = [hd, src];
    const t0 = T(0.7), span = Math.max(0.01, Math.min(A.outAt - 1.4, S * 0.55) - t0);
    items.forEach((it, k) => {
      const g = add(HF.el("div", "g"));
      const R = RR, W = 2 * R;
      if (PT) { const [px, py] = place(k); Object.assign(g.style, { left: (px - R) + "px", top: (py - R) + "px", width: W + "px", height: W + "px" }); }
      else Object.assign(g.style, { left: (x0 + k * (W + gap)) + "px", top: (cy - R) + "px", width: W + "px", height: W + "px" });
      const sv = HF.svg("svg", { width: W, height: W, viewBox: `0 0 ${W} ${W}` }, g);
      HF.svg("path", { d: arc(R - 8, a0, a0 + sweep), fill: "none", stroke: "rgba(120,170,230,0.14)", "stroke-width": 16, "stroke-linecap": "round" }, sv);
      const ticks = [];
      const NT = 41;
      for (let j = 0; j < NT; j++) {
        const deg = a0 + sweep * j / (NT - 1), big = j % 5 === 0;
        const [x1, y1] = pt(R - 34, deg), [x2, y2] = pt(R - (big ? 58 : 46), deg);
        ticks.push(HF.svg("line", { x1, y1, x2, y2, stroke: "rgba(160,200,255,0.25)", "stroke-width": big ? 4 : 2, "stroke-linecap": "round" }, sv));
      }
      // 对比:两个数同单位才按比例画,否则两条都满
      const pa = HF.splitNumber(it.value), pb = it.b ? HF.splitNumber(it.b) : null;
      let fa = 1, fb = 1;
      if (pa && pb && pa.tail.trim() === pb.tail.trim() && pa.num > 0 && pb.num > 0) {
        const m = Math.max(pa.num, pb.num); fa = pa.num / m; fb = pb.num / m;
      }
      const main = HF.svg("path", { d: arc(R - 8, a0, a0 + sweep), fill: "none", stroke: CA, "stroke-width": 16, "stroke-linecap": "round",
        pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1, style: "filter: drop-shadow(0 0 12px rgba(54,197,255,0.8))" }, sv);
      let second = null;
      if (it.b) second = HF.svg("path", { d: arc(R - 78, a0, a0 + sweep), fill: "none", stroke: CB, "stroke-width": 10, "stroke-linecap": "round",
        pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1, style: "filter: drop-shadow(0 0 10px rgba(255,181,71,0.7))" }, sv);
      const tip = HF.svg("circle", { cx: pt(R - 8, a0)[0], cy: pt(R - 8, a0)[1], r: 13, fill: "#fff", opacity: 0 }, sv);

      const num = HF.el("div", "num"); g.appendChild(num);
      const ns = HF.fit(it.value, W * 0.6, R * 0.44, 1.05);
      num.style.fontSize = ns + "px"; num.style.top = (R - ns * 0.6 - (it.b ? 26 : 0)) + "px";
      const lab = HF.el("div", "lab", it.label); lab.style.top = (W - 6) + "px"; g.appendChild(lab);
      const tag = HF.el("div", "tag", it.tag); tag.style.top = (W + 44) + "px"; g.appendChild(tag);
      let bEl = null;
      if (it.b) { bEl = HF.el("div", "b", it.b); bEl.style.fontSize = Math.round(ns * 0.42) + "px"; bEl.style.top = (R + ns * 0.55 + 10) + "px"; g.appendChild(bEl); }

      const at = t0 + (items.length > 1 ? span * k / (items.length - 1) : 0);
      const dur = Math.max(0.8, T(1.2));
      tl.fromTo(g, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, at - 0.2);
      tl.fromTo(main, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 1 - fa }, duration: dur, ease: "expo.out" }, at);
      if (second) tl.fromTo(second, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 1 - fb }, duration: dur, ease: "expo.out" }, at + 0.15);
      // 刻度随指针点亮,指针光点沿弧走
      const lit = { v: 0 };
      tl.to(lit, { v: fa, duration: dur, ease: "expo.out", onUpdate: () => {
        const deg = a0 + sweep * lit.v, [x, y] = pt(R - 8, deg);
        tip.setAttribute("cx", x.toFixed(1)); tip.setAttribute("cy", y.toFixed(1));
        ticks.forEach((t, j) => t.setAttribute("stroke", j / (NT - 1) <= lit.v + 1e-6 ? "rgba(140,220,255,0.95)" : "rgba(160,200,255,0.25)"));
      } }, at);
      tl.to(tip, { opacity: 1, duration: 0.2 }, at);
      HF.countText(tl, num, it.value, at, dur);
      tl.fromTo([lab, tag, bEl].filter(Boolean), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, at + 0.3);
      // 停留:光点呼吸
      tl.fromTo(tip, { attr: { r: 13 } }, { attr: { r: 18 }, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((A.outAt - at - dur) / 0.8)) }, at + dur);
      exitEls.push(g);
    });
    if (HF.cmp) {
      const lg = add(HF.el("div", "legend"));
      [[HF.cols[0], CA], [HF.cols[1], CB]].forEach(([nm, c]) => { const s = HF.el("span", "", nm); s.style.setProperty("--c", c); lg.appendChild(s); });
      tl.fromTo(lg, { opacity: 0 }, { opacity: 1, duration: 0.5 }, t0 + 0.4);
      exitEls.push(lg);
    }
    tl.fromTo(grid, { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px 60px", duration: S, ease: "none" }, 0);
    HF.exit(tl, exitEls, A.outAt, A.outDur);
    HF.register(tl);
  </script>
