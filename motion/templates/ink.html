<!-- @name 国潮水墨
     @desc 宣纸底 + 竖排行楷大标题 + 远山淡墨,每个参数是一方朱红印章,"啪"地盖下去
     @order 15
     @light yes -->
<style>
    html, body { background: #efe6d2; }
    #root { color: #1d1a16; font-family: "STKaiti", "KaiTi", serif;
            background:
              radial-gradient(ellipse 700px 420px at 260px 180px, rgba(60,50,40,0.10) 0%, rgba(60,50,40,0) 70%),
              radial-gradient(ellipse 900px 500px at 1650px 950px, rgba(60,50,40,0.12) 0%, rgba(60,50,40,0) 70%),
              #efe6d2; }
    .fiber { position: absolute; inset: 0; opacity: 0.35;
             background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.02 0.5' numOctaves='3'/%3E%3CfeColorMatrix values='0 0 0 0 0.3 0 0 0 0 0.25 0 0 0 0 0.2 0 0 0 0.25 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
    .hills { position: absolute; left: 0; bottom: 0; width: 2400px; height: 420px; overflow: visible; }
    .ttl { position: absolute; right: 150px; top: 90px; writing-mode: vertical-rl; font-family: "STXingkai", "STKaiti", serif; line-height: 1.05; letter-spacing: 0.06em; white-space: nowrap; }
    .kick { position: absolute; writing-mode: vertical-rl; font-size: 34px; letter-spacing: 0.4em; color: #6b5e4c; }
    .seal-s { position: absolute; width: 74px; height: 74px; border: 5px solid #b5261e; color: #b5261e; font-family: "STLiti", "STKaiti", serif;
              font-size: 30px; line-height: 30px; padding: 4px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; text-align: center; }
    .item { position: absolute; top: 0; height: 1080px; }
    .item .lab { position: absolute; writing-mode: vertical-rl; font-size: 46px; letter-spacing: 0.25em; white-space: nowrap; }
    .item .seal { position: absolute; background: #b5261e; color: #f6eedd; border-radius: 10px; display: flex; align-items: center; justify-content: center;
                  font-family: "STKaiti", serif; font-weight: 700; white-space: nowrap; box-shadow: inset 0 0 0 6px #b5261e, inset 0 0 0 9px rgba(246,238,221,0.75); }
    .item .b { position: absolute; font-size: 32px; color: #6b5e4c; white-space: nowrap; }
    .item .tag { position: absolute; font-size: 26px; color: #8a7c66; white-space: nowrap; }
    .src { position: absolute; left: 110px; bottom: 60px; font-size: 26px; color: #6b5e4c; letter-spacing: 0.2em; }
  </style>
<script>
    const { tl, D, add, items, A, T, S } = HF.boot();

    add(HF.el("div", "fiber"));
    // 远山:两层淡墨山影,慢慢平移
    const hills = add(HF.svg("svg", { class: "hills", width: 2400, height: 420, viewBox: "0 0 2400 420" }));
    const ridge = (seed, base, amp) => { const r = HF.rng(seed); let d = `M0 420 L0 ${base}`;
      for (let x = 0; x <= 2400; x += 80) d += ` Q${x + 40} ${base - amp * r()} ${x + 80} ${base - amp * 0.4 * r()}`; return d + " L2400 420 Z"; };
    const far = HF.svg("path", { d: ridge(5, 250, 170), fill: "rgba(70,62,52,0.13)" }, hills);
    const near = HF.svg("path", { d: ridge(9, 330, 120), fill: "rgba(40,34,28,0.22)" }, hills);
    tl.fromTo(hills, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.4, ease: "power2.out" }, 0);
    tl.fromTo(far, { x: 0 }, { x: -120, duration: S, ease: "none" }, 0);
    tl.fromTo(near, { x: 0 }, { x: -260, duration: S, ease: "none" }, 0);

    // 竖排标题:逐字晕开
    const ttl = add(HF.el("div", "ttl"));
    const title = D.title || "";
    const tsz = Math.min(150, 860 / Math.max(1, Array.from(title).length)); ttl.style.fontSize = tsz + "px";
    const tch = HF.chars(ttl, title);
    tl.fromTo(tch, { opacity: 0, filter: "blur(10px)", scale: 1.3 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.6, ease: "power2.out", stagger: 0.12 }, 0.2);
    const kick = add(HF.el("div", "kick", [D.subject, HF.kicker].filter(Boolean).join("·")));
    kick.style.right = (150 + tsz * 1.25) + "px"; kick.style.top = "100px";
    tl.fromTo(kick, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6 }, 0.5);
    const seal0 = add(HF.el("div", "seal-s")); seal0.style.right = "160px"; seal0.style.top = (120 + Array.from(title).length * tsz * 1.12) + "px";
    Array.from((HF.kicker || "参数").slice(0, 4)).forEach((ch) => seal0.appendChild(HF.el("span", "", ch)));
    tl.fromTo(seal0, { scale: 2, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.25, ease: "power4.in" }, 0.3 + tch.length * 0.12);

    // 参数:从右往左竖排一列一个,标签竖写,数字是一方大印
    const n = Math.max(1, items.length), colW = Math.min(380, 1250 / n);
    const t0 = T(1.0), span = Math.max(0, Math.min(A.outAt - 1.0, S * 0.62) - t0);
    const rng = HF.rng(21);
    items.forEach((it, k) => {
      const x = 1400 - (k + 1) * colW;
      const item = add(HF.el("div", "item")); item.style.left = x + "px"; item.style.width = colW + "px";
      const lab = HF.el("div", "lab", it.label); lab.style.left = (colW / 2 - 23) + "px"; lab.style.top = "150px"; item.appendChild(lab);
      const sw = colW - 50, sealH = Math.min(150, sw * 0.5);
      const seal = HF.el("div", "seal", it.value); seal.style.fontSize = HF.fit(it.value, sw - 40, 92, 0.95) + "px";
      Object.assign(seal.style, { left: "25px", top: "560px", width: sw + "px", height: sealH + "px" }); item.appendChild(seal);
      const extra = [];
      if (it.b) { const b = HF.el("div", "b", HF.cols[1] + " " + it.b); b.style.left = "28px"; b.style.top = (580 + sealH) + "px"; item.appendChild(b); extra.push(b); }
      else if (it.tag) { const tg = HF.el("div", "tag", it.tag); tg.style.left = "28px"; tg.style.top = (580 + sealH) + "px"; item.appendChild(tg); extra.push(tg); }
      const at = t0 + (items.length > 1 ? span * k / (items.length - 1) : 0);
      const rot = (rng() - 0.5) * 8;
      tl.fromTo(lab, { opacity: 0, clipPath: "inset(0 0 100% 0)" }, { opacity: 1, clipPath: "inset(0 0 0% 0)", duration: 0.6, ease: "power2.out" }, at);
      tl.fromTo(seal, { scale: 2.4, opacity: 0, rotation: rot - 10 }, { scale: 1, opacity: 1, rotation: rot, duration: 0.22, ease: "power4.in" }, at + 0.45);
      tl.to(item, { keyframes: [{ y: 4, duration: 0.04 }, { y: 0, duration: 0.08 }] }, at + 0.67);
      if (extra.length) tl.fromTo(extra, { opacity: 0 }, { opacity: 1, duration: 0.5 }, at + 0.8);
    });
    if (HF.cmp) { const s = add(HF.el("div", "src", "朱印 · " + HF.cols[0])); s.style.bottom = "110px"; tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0); }
    const src = add(HF.el("div", "src", D.source ? "据 " + D.source : ""));
    tl.fromTo(src, { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.0);
    tl.to(Array.from(root.children).filter((e) => e !== hills), { opacity: 0, filter: "blur(6px)", duration: A.outDur }, A.outAt);
    HF.register(tl);
  </script>
