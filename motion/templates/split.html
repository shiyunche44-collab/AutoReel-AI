<!-- @name 撞色分屏
     @desc 左半橙红色块 + 白色右半,车横跨分界线,参数表从右侧逐条推入
     @order 4
     @light yes -->
<meta name="hf-photo" content="scene" />
<style>
    html, body { background: #f6f5f1; }
    #root { background: #f6f5f1; color: #141414;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .left { position: absolute; left: 0; top: 0; bottom: 0; width: 820px; background: #ff4d2e; overflow: hidden; }
    .ghost { position: absolute; left: -30px; bottom: -70px; font-family: "Archivo Black", sans-serif; font-size: 420px; line-height: 1;
             color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,0.35); white-space: nowrap; }
    .kick { position: absolute; left: 96px; top: 96px; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 26px; font-weight: 700;
            letter-spacing: 0.25em; color: rgba(255,255,255,0.85); }
    .ttl { position: absolute; left: 96px; top: 150px; width: 660px; font-family: "HYZhongHeiTi", "Noto Sans SC", sans-serif; font-weight: 900;
           color: #fff; line-height: 1.08; }
    .photo { position: absolute; display: block; filter: drop-shadow(0 30px 30px rgba(0,0,0,0.25)); }
    .right { position: absolute; left: 1060px; right: 96px; }
    .it { position: relative; padding: 18px 0 16px; border-bottom: 2px solid #141414; overflow: hidden; }
    .it .lab { font-size: 28px; font-weight: 600; color: #6b6b6b; letter-spacing: 0.08em; }
    .it .val { font-family: "Montserrat", sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; white-space: nowrap; }
    .it .b { position: absolute; right: 0; bottom: 22px; font-family: "Montserrat", "Noto Sans SC", sans-serif; font-weight: 700; font-size: 40px; color: #ff4d2e; white-space: nowrap; }
    .it .b small { font-size: 22px; color: #6b6b6b; font-weight: 600; margin-right: 10px; }
    .it .tag { position: absolute; right: 0; top: 24px; font-size: 22px; color: #ff4d2e; font-weight: 600; }
    .src { position: absolute; right: 96px; bottom: 60px; font-size: 22px; color: #8a8a8a; }
    .sub { position: absolute; left: 96px; bottom: 80px; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 30px; font-weight: 700; color: #fff; }
  </style>
<script>
    const { tl, D, add, items, A, T, S } = HF.boot();
    const P = D.photo;

    const left = add(HF.el("div", "left"));
    const ghost = HF.el("div", "ghost", String(items.length ? (HF.parts(items[0].value) || { num: "" }).num : "") || "SPEC"); left.appendChild(ghost);
    const kick = HF.el("div", "kick", (HF.kicker || "SPEC").toUpperCase()); left.appendChild(kick);
    const ttl = HF.el("div", "ttl", D.title || ""); left.appendChild(ttl);
    ttl.style.fontSize = Math.min(120, HF.fit(D.title || "", 1300, 120)) + "px";
    const sub = HF.el("div", "sub", D.subject || ""); left.appendChild(sub);
    tl.fromTo(left, { xPercent: -100 }, { xPercent: 0, duration: 0.7, ease: "expo.out" }, 0);
    tl.fromTo([kick, ttl, sub], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.35);
    tl.fromTo(ghost, { x: 0 }, { x: -160, duration: S, ease: "none" }, 0);
    const exitEls = [];

    if (P) {
      const ph = add(HF.photoImg("photo"));
      const pw = 880, hh = pw * P.height / P.width;
      Object.assign(ph.style, { width: pw + "px", height: hh + "px", left: "130px", top: (870 - P.floor * hh) + "px" });
      tl.fromTo(ph, { x: -500, opacity: 0, filter: "blur(12px) drop-shadow(0 30px 30px rgba(0,0,0,0.25))" },
                    { x: 0, opacity: 1, filter: "blur(0px) drop-shadow(0 30px 30px rgba(0,0,0,0.25))", duration: 1.0, ease: "expo.out" }, 0.4);
      tl.fromTo(ph, { y: 0 }, { y: -12, duration: S, ease: "none" }, 0);
      exitEls.push(ph);
    }

    const right = add(HF.el("div", "right"));
    const rowH = items.length > 3 ? 190 : 220;
    right.style.top = Math.max(110, (1080 - rowH * items.length) / 2 - 20) + "px";
    const t0 = T(0.9), span = Math.max(0, Math.min(A.outAt - 1.3, S * 0.55) - t0);
    items.forEach((it, k) => {
      const row = HF.el("div", "it"); row.style.height = rowH + "px";
      const lab = HF.el("div", "lab", it.label); row.appendChild(lab);
      const val = HF.el("div", "val"); val.style.fontSize = HF.fit(it.value, it.b ? 440 : 700, rowH * 0.58, 1.05) + "px"; row.appendChild(val);
      const extra = [];
      if (it.b) { const b = HF.el("div", "b"); b.appendChild(HF.el("small", "", HF.cols[1])); b.appendChild(document.createTextNode(it.b)); row.appendChild(b); extra.push(b); }
      else if (it.tag) { const tg = HF.el("div", "tag", it.tag); row.appendChild(tg); extra.push(tg); }
      right.appendChild(row);
      const at = t0 + (items.length > 1 ? span * k / (items.length - 1) : 0);
      tl.fromTo(row, { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, at);
      HF.countText(tl, val, it.value, at + 0.1, 0.9);
      if (extra.length) tl.fromTo(extra, { opacity: 0 }, { opacity: 1, duration: 0.4 }, at + 0.4);
    });
    if (HF.cmp) {
      const lg = HF.el("div", "lab", "▍" + HF.cols[0]); lg.style.cssText = "position:absolute;left:0;top:-56px;font-size:26px;font-weight:700;color:#141414";
      right.appendChild(lg);
    }
    const src = add(HF.el("div", "src", D.source || ""));
    tl.fromTo(src, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);
    exitEls.push(right, src);
    HF.exit(tl, exitEls, A.outAt, A.outDur);
    tl.to(left, { xPercent: -100, duration: A.outDur, ease: "power2.in" }, A.outAt);
    HF.register(tl);
  </script>
