<!-- @name 瑞士海报
     @desc 白底红黑三色、严格网格的国际主义海报,横条硬切推入,红色块在条目间跳动
     @order 12
     @light yes -->
<style>
    html, body { background: #f4f2ee; }
    #root { background: #f4f2ee; color: #111;
            font-family: "HYZhongHeiTi", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .cols { position: absolute; inset: 0; display: flex; padding: 0 80px; gap: 0; }
    .cols i { flex: 1; border-left: 1px solid rgba(17,17,17,0.08); }
    .side { position: absolute; left: 80px; top: 80px; width: 60px; height: 920px; }
    .side span { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%);
                 font-family: "Archivo Black", "HYZhongHeiTi", sans-serif; font-size: 34px; letter-spacing: 0.2em; white-space: nowrap; }
    .circle { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: #e30613; right: -140px; top: -170px; }
    .ttl { position: absolute; left: 200px; top: 96px; font-weight: 900; line-height: 1.05; white-space: nowrap; }
    .sub { position: absolute; left: 204px; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 28px; font-weight: 700; color: #e30613; letter-spacing: 0.06em; }
    .row { position: absolute; left: 200px; right: 80px; height: 150px; border-top: 6px solid #111; overflow: hidden; }
    .row .no { position: absolute; left: 0; top: 14px; width: 120px; height: 120px; font-family: "Archivo Black", sans-serif; font-size: 96px; line-height: 120px; text-align: center; color: #111; }
    .row .lab { position: absolute; left: 160px; top: 24px; font-size: 40px; font-weight: 900; white-space: nowrap; }
    .row .tag { position: absolute; left: 160px; top: 86px; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 24px; font-weight: 600; color: #777; white-space: nowrap; }
    .row .val { position: absolute; right: 0; top: 4px; font-family: "Archivo Black", "HYZhongHeiTi", sans-serif; letter-spacing: -0.03em; line-height: 1.1; white-space: nowrap; }
    .row .b { position: absolute; right: 0; top: 4px; font-family: "Archivo Black", "HYZhongHeiTi", sans-serif; color: #e30613; white-space: nowrap; line-height: 1.1; }
    .mark { position: absolute; left: 200px; width: 120px; height: 120px; background: #e30613; }
    .src { position: absolute; right: 80px; bottom: 40px; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 22px; font-weight: 600; color: #777; }
    .legend { position: absolute; right: 80px; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 26px; font-weight: 700; display: flex; gap: 40px; }
  </style>
<script>
    const { tl, D, add, items, A, T, S } = HF.boot();

    const cols = add(HF.el("div", "cols")); for (let k = 0; k < 12; k++) cols.appendChild(HF.el("i"));
    const circle = add(HF.el("div", "circle"));
    tl.fromTo(circle, { scale: 0 }, { scale: 1, duration: 0.7, ease: "expo.out" }, 0.05);
    tl.fromTo(circle, { x: 0, y: 0 }, { x: -60, y: 30, duration: S, ease: "none" }, 0);
    const side = add(HF.el("div", "side")); const sp = HF.el("span", "", ((D.subject || "") + " — " + (HF.kicker || "SPEC")).toUpperCase()); side.appendChild(sp);
    tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.3);
    tl.fromTo(side, { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.6, ease: "steps(8)" }, 0.3);
    const ttl = add(HF.el("div", "ttl", D.title || ""));
    const ts = HF.fit(D.title || "", 1180, 150); ttl.style.fontSize = ts + "px";
    tl.fromTo(ttl, { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.15);
    const sub = add(HF.el("div", "sub", D.source ? "数据来源 / " + D.source : "")); sub.style.top = (110 + ts * 1.1) + "px";
    tl.fromTo(sub, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);

    const rowH = 150, top0 = Math.max(400, 1000 - rowH * items.length);
    if (HF.cmp) {
      const lg = add(HF.el("div", "legend")); lg.style.top = (top0 - 50) + "px";
      const a = HF.el("span", "", "■ " + HF.cols[0]); const b = HF.el("span", "", "■ " + HF.cols[1]); b.style.color = "#e30613";
      lg.appendChild(a); lg.appendChild(b);
      tl.fromTo(lg, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.8);
    }
    const mark = add(HF.el("div", "mark")); tl.set(mark, { opacity: 0 }, 0);
    const t0 = T(0.75), span = Math.max(0, Math.min(A.outAt - 1.0, S * 0.62) - t0);
    items.forEach((it, k) => {
      const row = HF.el("div", "row"); row.style.top = (top0 + k * rowH) + "px";
      const no = HF.el("div", "no", String(k + 1)); row.appendChild(no);
      row.appendChild(HF.el("div", "lab", it.label));
      if (it.tag) row.appendChild(HF.el("div", "tag", it.tag));
      const val = HF.el("div", "val"); const vs = HF.fit(it.value, it.b ? 520 : 900, 124, 1.4); val.style.fontSize = vs + "px"; row.appendChild(val);
      if (it.b) { const b = HF.el("div", "b", it.b); b.style.fontSize = Math.round(vs * 0.7) + "px"; val.style.right = "560px"; b.style.top = (4 + vs * 0.2) + "px"; row.appendChild(b); }
      add(row);
      const at = t0 + (items.length > 1 ? span * k / (items.length - 1) : 0);
      const dir = k % 2 ? 1 : -1;
      tl.fromTo(row, { x: dir * 1900 }, { x: 0, duration: 0.42, ease: "expo.out" }, at);
      HF.countText(tl, val, it.value, at + 0.1, 0.6, { ease: "power4.out" });
      // 红块跳到这一行,编号反白
      tl.set(mark, { opacity: 1, top: (top0 + k * rowH + 6 + 14) + "px" }, at + 0.25);
      tl.fromTo(mark, { scale: 0.4 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, at + 0.25);
      tl.set(no, { color: "#f4f2ee", zIndex: 2 }, at + 0.25);
      if (k) tl.set(root.querySelectorAll(".row .no")[k - 1], { color: "#111" }, at + 0.25);
    });
    // 编号要压在红块上:红块放进行的下层
    root.insertBefore(mark, root.querySelector(".row"));
    root.querySelectorAll(".row").forEach((r) => { r.style.background = "transparent"; });
    const src = add(HF.el("div", "src", "SPEC SHEET · " + new Array(1).fill(D.subject || "").join("")));
    tl.fromTo(src, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.0);
    tl.to(root.children, { opacity: 0, duration: A.outDur, ease: "steps(3)" }, A.outAt);
    HF.register(tl);
  </script>
