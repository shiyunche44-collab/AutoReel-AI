<!-- @name 极客终端
     @desc 黑底绿字命令行,敲命令查参数,结果逐行打出,带进度条和闪烁光标
     @order 6 -->
<style>
    html, body { background: #020604; }
    #root { color: #39ff7a;
            font-family: "JetBrains Mono", "SimHei", monospace;
            background: radial-gradient(ellipse 1300px 900px at 960px 540px, #04180c 0%, #020604 75%); }
    .win { position: absolute; left: 130px; top: 110px; width: 1660px; height: 860px; border: 2px solid rgba(57,255,122,0.35); border-radius: 14px;
           background: rgba(2,14,6,0.6); box-shadow: 0 0 60px rgba(57,255,122,0.08), inset 0 0 80px rgba(57,255,122,0.04); }
    .bar { height: 56px; border-bottom: 2px solid rgba(57,255,122,0.25); display: flex; align-items: center; padding: 0 26px; gap: 14px;
           font-size: 22px; color: rgba(57,255,122,0.6); }
    .bar i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(57,255,122,0.6); display: block; }
    .bar span { margin-left: 18px; }
    .body { position: absolute; left: 50px; right: 50px; top: 96px; font-size: 36px; line-height: 1.7; text-shadow: 0 0 10px rgba(57,255,122,0.55); }
    .ln { white-space: pre; height: 61px; }
    .dim { color: rgba(57,255,122,0.5); }
    .val { color: #d9ffe6; font-weight: 700; }
    .b { color: #ffd23f; font-weight: 700; }
    .cur { display: inline-block; width: 20px; height: 40px; background: #39ff7a; vertical-align: -6px; margin-left: 4px; box-shadow: 0 0 12px #39ff7a; }
    .scan { position: absolute; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 2px, transparent 2px, transparent 5px); }
    .beam { position: absolute; left: 0; right: 0; height: 200px; pointer-events: none;
            background: linear-gradient(180deg, rgba(57,255,122,0) 0%, rgba(57,255,122,0.05) 50%, rgba(57,255,122,0) 100%); }
  </style>
<script>
    const { tl, D, add, items, A, T, S } = HF.boot({ items: 5 });

    const win = add(HF.el("div", "win"));
    const bar = HF.el("div", "bar"); [0, 1, 2].forEach(() => bar.appendChild(HF.el("i")));
    bar.appendChild(HF.el("span", "", "spec@garage: ~/" + (D.scene || "spec"))); win.appendChild(bar);
    const body = HF.el("div", "body"); win.appendChild(body);
    tl.fromTo(win, { opacity: 0, scaleY: 0.02 }, { opacity: 1, scaleY: 1, duration: 0.45, ease: "expo.out" }, 0.05);

    const line = (cls) => { const l = HF.el("div", "ln " + (cls || "")); body.appendChild(l); return l; };
    const cur = HF.el("span", "cur");
    const moveCur = (el, at) => tl.call(() => el.appendChild(cur), null, at);
    // 1. 敲命令
    const cmd = line();
    const prompt = HF.el("span", "dim", "$ "); cmd.appendChild(prompt);
    const ctext = HF.el("span"); cmd.appendChild(ctext);
    const q = `spec --car "${D.subject || ""}" --topic ${HF.kicker || D.title || "all"}`;
    tl.set(cur, { opacity: 1 }, 0);
    moveCur(cmd, 0.3);
    let t = HF.type(tl, ctext, q, 0.4, Math.max(30, q.length / Math.max(0.6, T(1.0))));
    // 2. 进度条
    const prog = line("dim");
    const pW = 30, pAt = t + 0.12, pDur = Math.max(0.35, T(0.6));
    HF.drive(tl, (x) => {
      const f = Math.min(1, x / pDur), k = Math.round(f * pW);
      prog.textContent = "[" + "#".repeat(k) + ".".repeat(pW - k) + "] " + String(Math.round(f * 100)).padStart(3) + "%  fetching";
    }, pAt, pDur + 0.01);
    tl.set(prog, { opacity: 0 }, 0); tl.set(prog, { opacity: 1 }, pAt);
    t = pAt + pDur + 0.1;
    // 3. 标题
    const head = line("dim");
    tl.set(head, { opacity: 0 }, 0); tl.set(head, { opacity: 1 }, t);
    head.textContent = "# " + (D.title || "") + (HF.cmp ? `   (${HF.cols[0]} vs ${HF.cols[1]})` : "");
    // 4. 结果逐行打出:标签 ..... 数值
    const span = Math.max(0.01, Math.min(A.outAt - 1.0, S * 0.7) - t - 0.2);
    items.forEach((it, k) => {
      const l = line(); tl.set(l, { opacity: 0 }, 0);
      const at = t + 0.2 + (items.length > 1 ? span * k / (items.length - 1) : 0);
      const labW = Array.from(it.label).reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? 2 : 1), 0);
      const dots = " " + ".".repeat(Math.max(3, 22 - labW)) + " ";
      const lab = HF.el("span", "", "> " + it.label); const dd = HF.el("span", "dim", dots);
      const val = HF.el("span", "val"); l.appendChild(lab); l.appendChild(dd); l.appendChild(val);
      tl.set(l, { opacity: 1 }, at);
      moveCur(l, at);
      HF.countText(tl, val, it.value, at + 0.05, 0.6, { ease: "power2.out" });
      if (it.b) { const vs = HF.el("span", "dim", "  vs  "); const b = HF.el("span", "b", it.b); l.appendChild(vs); l.appendChild(b);
        tl.fromTo([vs, b], { opacity: 0 }, { opacity: 1, duration: 0.01 }, at + 0.35); }
      else if (it.tag) { const tg = HF.el("span", "dim", "   // " + it.tag); l.appendChild(tg); tl.fromTo(tg, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at + 0.4); }
    });
    if (D.source) { const s = line("dim"); s.textContent = "-- source: " + D.source; tl.set(s, { opacity: 0 }, 0);
      const at = Math.min(A.outAt - 0.4, t + span + 0.6); tl.set(s, { opacity: 1 }, at); moveCur(s, at); }
    // 光标闪烁、扫描光带上下走(停留段一直在动)
    for (let x = 0.5; x < S; x += 0.5) tl.set(cur, { opacity: Math.round(x * 2) % 2 ? 0 : 1 }, x);
    add(HF.el("div", "scan"));
    const beam = add(HF.el("div", "beam"));
    tl.fromTo(beam, { y: -200 }, { y: 1080, duration: 2.6, ease: "none", repeat: Math.ceil(S / 2.6) }, 0);
    tl.to(win, { opacity: 0, scaleY: 0.02, duration: A.outDur, ease: "power2.in" }, A.outAt);
    HF.register(tl);
  </script>
