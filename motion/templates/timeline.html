<!-- @name 横向时间轴
     @desc 浅灰底一条长轴,镜头沿轴平移到每个节点,节点点亮、橙色进度线跟着走,最后拉远看全貌
     @order 10
     @light yes
     @sample 6.35
     @portrait yes -->
<style>
    html, body { background: #eceef1; }
    #root { background: #eceef1; color: #15181d;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(21,24,29,0.12) 2px, transparent 2px); background-size: 40px 40px; }
    .hd { position: absolute; left: 110px; top: 86px; z-index: 3; }
    .hd .k { font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.2em; color: #ff6a13; }
    .hd .t { margin-top: 8px; font-size: 64px; font-weight: 800; white-space: nowrap; }
    .src { position: absolute; right: 110px; top: 100px; font-size: 22px; color: #8a9099; z-index: 3; }
    .track { position: absolute; left: 0; top: 0; height: 1080px; transform-origin: 0 600px; }
    .rail { position: absolute; top: 598px; height: 4px; background: #c9ced6; border-radius: 2px; }
    .fill { position: absolute; top: 597px; height: 6px; background: #ff6a13; border-radius: 3px; transform-origin: 0 50%; }
    .node { position: absolute; top: 600px; width: 0; height: 0; }
    .node .c { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; background: #eceef1; border: 5px solid #c9ced6; }
    .node .c i { position: absolute; inset: 6px; border-radius: 50%; background: #ff6a13; transform: scale(0); }
    .node .no { position: absolute; left: -10px; bottom: 60px; font-family: "Inter", sans-serif; font-size: 30px; font-weight: 800; color: #ff6a13; }
    .node .lab { position: absolute; left: -10px; bottom: 100px; font-size: 40px; font-weight: 700; white-space: nowrap; }
    .node .val { position: absolute; left: -14px; top: 54px; font-family: "Inter", sans-serif; font-weight: 800; letter-spacing: -0.04em; white-space: nowrap; line-height: 1; }
    .node .b { position: absolute; left: -10px; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 34px; font-weight: 700; color: #8a9099; white-space: nowrap; }
    .node .tag { position: absolute; left: -10px; font-size: 26px; color: #8a9099; white-space: nowrap; }
    .start { position: absolute; top: 600px; }
    .start .s { position: absolute; left: 0; top: -14px; width: 28px; height: 28px; border-radius: 50%; background: #15181d; }
    .start .w { position: absolute; left: 0; top: 40px; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 26px; font-weight: 700; color: #8a9099; white-space: nowrap; letter-spacing: 0.1em; }
    /* portrait: the axis runs down the left side; the camera pans down to each node */
    [data-aspect=portrait] .hd { left: 64px; top: 230px; }
    [data-aspect=portrait] .hd .t { font-size: 58px; }
    [data-aspect=portrait] .src { right: auto; left: 64px; top: 390px; }
    [data-aspect=portrait] .track { width: 1080px; transform-origin: 160px 0; }
    [data-aspect=portrait] .rail { top: auto; width: 4px; left: 158px; }
    [data-aspect=portrait] .fill { top: auto; width: 6px; left: 157px; transform-origin: 50% 0; }
    [data-aspect=portrait] .node { top: auto; left: 160px; }
    [data-aspect=portrait] .node .no { left: 60px; bottom: auto; top: -104px; }
    [data-aspect=portrait] .node .lab { left: 60px; bottom: auto; top: -66px; }
    [data-aspect=portrait] .node .val { left: 56px; top: -4px; }
    [data-aspect=portrait] .start { top: auto; left: 160px; }
    [data-aspect=portrait] .start .s { left: -14px; top: 0; }
    [data-aspect=portrait] .start .w { left: 40px; top: 0; }
  </style>
<script>
    const { tl, D, add, items, A, T, S } = HF.boot({ items: 5 });

    const dots = add(HF.el("div", "dots"));
    const hd = add(HF.el("div", "hd"));
    hd.appendChild(HF.el("div", "k", [D.subject, HF.kicker].filter(Boolean).join(" · ")));
    hd.appendChild(HF.el("div", "t", D.title || ""));
    const src = add(HF.el("div", "src", D.source || ""));
    tl.fromTo(hd.children, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 0.1);
    tl.fromTo(src, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.4);

    const PT = HF.portrait;
    const GAP = PT ? 380 : 720, X0 = PT ? 520 : 260, FOCUS = PT ? 900 : 1000;
    const track = add(HF.el("div", "track"));
    const n = items.length, end = X0 + 200 + Math.max(0, n - 1) * GAP + 600;
    // 竖屏:同一套坐标沿 y 走(X0 / GAP / end 都是纵向位置)
    const P0 = PT ? "top" : "left", LEN = PT ? "height" : "width";
    if (PT) track.style.height = end + "px"; else track.style.width = end + "px";
    const rail = HF.el("div", "rail"); rail.style[P0] = X0 + "px"; rail.style[LEN] = (end - X0) + "px"; track.appendChild(rail);
    const fill = HF.el("div", "fill"); fill.style[P0] = X0 + "px"; fill.style[LEN] = (end - X0) + "px"; track.appendChild(fill);
    const st = HF.el("div", "start"); st.style[P0] = X0 + "px"; st.appendChild(HF.el("i", "s")); st.appendChild(HF.el("div", "w", "START")); track.appendChild(st);
    const SC = PT ? "scaleY" : "scaleX", TX = PT ? "y" : "x";
    tl.fromTo(rail, { [SC]: 0, transformOrigin: PT ? "50% 0" : "0 50%" }, { [SC]: 1, duration: 1.2, ease: "expo.inOut" }, 0.2);
    tl.fromTo(st, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
    tl.set(fill, { [SC]: 0 }, 0);

    // 分段:每个节点一段(镜头移过去 → 点亮 → 停留),有时间就最后拉远看全貌
    const overview = n > 1 && S >= 5.5;
    const t0 = T(0.8), tEnd = overview ? A.outAt - Math.max(1.0, S * 0.16) : A.outAt;
    const L = n ? (tEnd - t0) / n : 0;
    const nodeX = (k) => X0 + 200 + k * GAP;
    let camX = 0;
    items.forEach((it, k) => {
      const x = nodeX(k);
      const nd = HF.el("div", "node"); nd.style[P0] = x + "px"; track.appendChild(nd);
      const c = HF.el("div", "c"); const dot = HF.el("i"); c.appendChild(dot); nd.appendChild(c);
      const no = HF.el("div", "no", String(k + 1).padStart(2, "0")); nd.appendChild(no);
      const lab = HF.el("div", "lab", it.label); nd.appendChild(lab);
      const val = HF.el("div", "val"); const vs = PT ? HF.fit(it.value, 780, 140, 1.05) : HF.fit(it.value, GAP - 120, 130, 1.05);
      val.style.fontSize = vs + "px"; nd.appendChild(val);
      const extra = [];
      const off = PT ? 10 : 70;
      if (it.b) { const b = HF.el("div", "b", HF.cols[1] + "  " + it.b); b.style.top = (off + vs) + "px"; if (PT) b.style.left = "60px"; nd.appendChild(b); extra.push(b); }
      else if (it.tag) { const tg = HF.el("div", "tag", it.tag); tg.style.top = (off + 6 + vs) + "px"; if (PT) tg.style.left = "60px"; nd.appendChild(tg); extra.push(tg); }
      const at = t0 + k * L;
      const toX = Math.min(0, FOCUS - x);
      const move = Math.min(0.8, L * 0.4);
      tl.fromTo(track, { [TX]: camX }, { [TX]: toX, duration: move, ease: "power3.inOut", immediateRender: false }, at);
      camX = toX;
      tl.to(fill, { [SC]: (x - X0) / (end - X0), duration: move, ease: "power3.inOut" }, at);
      tl.to(c, { borderColor: "#ff6a13", duration: 0.2 }, at + move * 0.7);
      tl.to(dot, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at + move * 0.7);
      tl.fromTo([no, lab], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.06 }, at + move * 0.6);
      tl.fromTo(val, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at + move * 0.75);
      HF.countText(tl, val, it.value, at + move * 0.75, Math.min(1.0, L * 0.5));
      if (extra.length) tl.fromTo(extra, { opacity: 0 }, { opacity: 1, duration: 0.4 }, at + move + 0.2);
      // 停留:镜头继续缓慢右移
      tl.to(track, { [TX]: toX - 40, duration: Math.max(0.1, L - move), ease: "none" }, at + move);
      camX = toX - 40;
    });
    if (overview && PT) {
      // 竖屏拉远:整条轴装进 520–1480
      const span = nodeX(n - 1) + 300 - X0, sc = Math.min(1, 960 / span);
      tl.to(track, { y: 520 - X0 * sc, scale: sc, duration: 0.9, ease: "power3.inOut" }, tEnd);
      tl.to(fill, { scaleY: (nodeX(n - 1) - X0) / (end - X0), duration: 0.9 }, tEnd);
    } else if (overview) {
      const span = nodeX(n - 1) + 620 - X0, sc = Math.min(1, 1700 / span);
      tl.to(track, { x: 110 - X0 * sc, scale: sc, y: 60 * (1 - sc), duration: 0.9, ease: "power3.inOut" }, tEnd);
      tl.to(fill, { scaleX: (nodeX(n - 1) - X0) / (end - X0), duration: 0.9 }, tEnd);
    }
    tl.fromTo(dots, { backgroundPosition: "0px 0px" }, { backgroundPosition: "-200px 0px", duration: S, ease: "none" }, 0);
    HF.exit(tl, [hd, src, track], A.outAt, A.outDur);
    HF.register(tl);
  </script>
